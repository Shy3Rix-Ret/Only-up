; ============================================================================
;  RoGlow - Balanced  (Zielhardware: GTX 1660 / RTX 3050-3060 / RX 6600 @ 1080p)
;  Budget: ca. 3-5 ms Frametime-Aufschlag => bei 100 FPS bleiben ~85-90 FPS.
;
;  Reihenfolge der Techniques ist NICHT beliebig - ReShade rendert von oben
;  nach unten:
;    1. MXAO      - braucht unveraendertes Bild + Depth
;    2. RBM       - legt Reflexionen auf das bereits verschattete Bild
;    3. Bloom     - nimmt Highlights inkl. der neuen Reflexionen auf
;    4. Tonemap   - komprimiert den durch Bloom angehobenen Dynamikumfang
;    5. Vibrance  - Saettigung NACH dem Tonemapping, sonst clippt es
;    6. Curves    - Kontrast zuletzt in der Farbkette
;    7. CAS       - Schaerfen IMMER ganz am Ende
;
;  Nicht aktiv (Datei vorhanden, in ReShade-UI zuschaltbar):
;    ADOF (Depth of Field), SSR (teuer), DELC_Sharpen, LumaSharpen,
;    LiftGammaGain, DisplayDepth (Depth-Buffer-Diagnose)
; ============================================================================

Techniques=MXAO@qUINT_mxao.fx,ReflectiveBumpmapping@ReflectiveBumpMapping.fx,Bloom@qUINT_bloom.fx,Tonemap@Tonemap.fx,Vibrance@Vibrance.fx,Curves@Curves.fx,ContrastAdaptiveSharpen@CAS.fx
TechniqueSorting=MXAO@qUINT_mxao.fx,SSR@qUINT_ssr.fx,ReflectiveBumpmapping@ReflectiveBumpMapping.fx,Bloom@qUINT_bloom.fx,Tonemap@Tonemap.fx,Vibrance@Vibrance.fx,Curves@Curves.fx,LiftGammaGain@LiftGammaGain.fx,ContrastAdaptiveSharpen@CAS.fx,LumaSharpen@LumaSharpen.fx,DELC_Sharpen@qUINT_sharp.fx,ADOF@qUINT_dof.fx,DisplayDepth@DisplayDepth.fx

; --- Globale Preprocessor-Defines -------------------------------------------
; RESHADE_DEPTH_INPUT_IS_REVERSED=1 ist bei modernen D3D11-Engines der Normalfall.
; Falls MXAO nichts tut: DisplayDepth aktivieren. Nahe Objekte muessen SCHWARZ
; sein. Sind sie weiss -> hier auf 0 stellen. Ist alles schwarz/weiss -> in der
; ReShade-UI unter "Add-ons > Generic depth" einen anderen Buffer waehlen.
;
; MXAO_ENABLE_IL=0 ist eine bewusste Performance-Entscheidung: Indirect
; Lighting verdoppelt die MXAO-Kosten und erzeugt auf Roblox' flach
; schattierten Flaechen vor allem Farbrauschen statt Lichtsimulation.
PreprocessorDefinitions=RESHADE_DEPTH_INPUT_IS_REVERSED=1,RESHADE_DEPTH_INPUT_IS_UPSIDE_DOWN=0,RESHADE_DEPTH_INPUT_IS_LOGARITHMIC=0,RESHADE_DEPTH_LINEARIZATION_FAR_PLANE=1000.0,MXAO_ENABLE_IL=0,MXAO_SMOOTHNORMALS=0,MXAO_HIGH_QUALITY=0,MXAO_TWO_LAYER=0,MXAO_MIPLEVEL_AO=0,MXAO_MIPLEVEL_IL=2,MATERIAL_TYPE=0

; --- Ambient Occlusion ------------------------------------------------------
; Groesster Einzelposten im Budget (~1.5-2.5 ms).
; RENDER_SCALE 0.71: AO ist ein niederfrequentes Signal und wird ohnehin
;   geblurrt - bei 0.71x sind es ~50% der Pixel bei praktisch gleichem Bild.
; SAMPLE_RADIUS 2.0 statt 5.0 (RoShade): 5.0 erzeugt grossflaechige dunkle
;   Hoefe, die auf Roblox' Klotzgeometrie wie Dreck aussehen. 2.0 gibt
;   Kontaktschatten in Ecken - das ist der Effekt, den man eigentlich will.
; SSAO_AMOUNT 0.65: der am haeufigsten uebertriebene Wert ueberhaupt. Ab 1.0
;   wird jede Ecke schwarz. 0.65 gibt Tiefe, ohne dass Roblox aussieht, als
;   haette es Schimmel.
; NORMAL_BIAS 0.20 gegen Self-Occlusion-Flimmern auf flachen Waenden.
; FADE_DEPTH_END 0.35: AO nur im Nahbereich. Weiter hinten sieht man es
;   ohnehin nicht, und es verhindert AO-Schlieren auf der Skybox.
[qUINT_mxao.fx]
MXAO_GLOBAL_SAMPLE_QUALITY_PRESET=1
MXAO_GLOBAL_RENDER_SCALE=0.710000
MXAO_SAMPLE_RADIUS=2.000000
MXAO_SAMPLE_RADIUS_SECONDARY=0.200000
MXAO_SAMPLE_NORMAL_BIAS=0.200000
MXAO_SSAO_AMOUNT=0.650000
MXAO_SSIL_AMOUNT=0.000000
MXAO_SSIL_SATURATION=1.000000
MXAO_BLEND_TYPE=1
MXAO_FADE_DEPTH_START=0.050000
MXAO_FADE_DEPTH_END=0.350000
MXAO_DEBUG_VIEW_ENABLE=0

; --- Reflexionen ------------------------------------------------------------
; Reflective Bump Mapping statt echtem SSR: leitet eine Normal-Map aus der
; Luminanz ab, kein Ray-Marching. Kostet ~1 ms statt ~4 ms und liefert genau
; den "polierte Plastik"-Look, den Roblox-Shader ausmacht.
; SampleCount 16 statt 24 (RoShade): ~33% guenstiger, bei 1080p kaum sichtbar.
; FresnelReflectance 0.18 statt 0.232: 0.232 sieht nach Spiegel/nass aus,
;   0.18 liest sich als "glaenzender Kunststoff".
; ReliefHeight 0.30 statt 0.387: hoehere Werte erzeugen sichtbares
;   Normal-Map-Rauschen auf Roblox' grossen glatten Flaechen.
; Color-Masken: Blau/Cyan (Wasser, Glas, Himmelslicht) voll, warme und
;   organische Toene halb - bildet nach, dass raue Materialien real weniger
;   spiegeln. Alles auf 1.0 laesst die ganze Welt nass wirken.
[ReflectiveBumpMapping.fx]
iRBM_SampleCount=16
fRBM_BlurWidthPixels=64.000000
fRBM_FresnelMult=0.220000
fRBM_FresnelReflectance=0.180000
fRBM_ReliefHeight=0.300000
fRBM_LowerThreshold=0.050000
fRBM_UpperThreshold=0.700000
fRBM_ColorMask_Red=0.500000
fRBM_ColorMask_Orange=0.700000
fRBM_ColorMask_Yellow=0.500000
fRBM_ColorMask_Green=0.500000
fRBM_ColorMask_Cyan=1.000000
fRBM_ColorMask_Blue=1.000000
fRBM_ColorMask_Magenta=0.500000

; --- Bloom ------------------------------------------------------------------
; INTENSITY 0.60 statt 1.20 (RoShade): Roblox ist von Haus aus hell. Doppelte
;   Intensitaet auf einem ohnehin hellen Bild = Milchglas.
; CURVE 2.20 statt 1.50: hoehere Kurve heisst, nur wirklich helle Pixel
;   bluehen. Das ist der Unterschied zwischen "Highlights glueh en" und
;   "der ganze Bildschirm leuchtet".
; LAYER_MULT: Gewicht auf die ENGEN Layer (1-3). RoShade hatte Layer 5 auf
;   0.5 - ein bildschirmbreiter Halo, genau der wasch ige Look, den man nicht
;   will. Enge Layer = knackiger Glow direkt an der Kante.
; SAT 1.35 statt 2.00: 2.00 faerbt den Glow neon.
; ADAPT_STRENGTH 0.0: Auto-Belichtung AUS. Sonst pulsiert die Bildhelligkeit
;   beim Drehen der Kamera - im Spiel stoerend und macht Screenshots
;   inkonsistent.
[qUINT_bloom.fx]
BLOOM_INTENSITY=0.600000
BLOOM_CURVE=2.200000
BLOOM_SAT=1.350000
BLOOM_TONEMAP_COMPRESSION=4.000000
BLOOM_LAYER_MULT_1=0.300000
BLOOM_LAYER_MULT_2=0.250000
BLOOM_LAYER_MULT_3=0.180000
BLOOM_LAYER_MULT_4=0.120000
BLOOM_LAYER_MULT_5=0.060000
BLOOM_LAYER_MULT_6=0.020000
BLOOM_LAYER_MULT_7=0.010000
BLOOM_ADAPT_EXPOSURE=0.000000
BLOOM_ADAPT_SPEED=2.000000
BLOOM_ADAPT_STRENGTH=0.000000

; --- Tonemapping ------------------------------------------------------------
; Gamma bleibt auf 1.0. Gamma zu verstellen ist der haeufigste Grund, warum
; Presets ausgewaschen aussehen - es hebt die Schwarzwerte an, statt Kontrast
; zu erzeugen. Kontrast macht Curves weiter unten, sauber per S-Kurve.
; Saturation 0.10 ist bewusst niedrig, weil Vibrance direkt danach nochmal
; nachlegt und sich beides multipliziert.
[Tonemap.fx]
Gamma=1.000000
Exposure=0.000000
Saturation=0.100000
Bleach=0.000000
Defog=0.000000
FogColor=0.000000,0.000000,1.000000

; --- Vibrance ---------------------------------------------------------------
; Vibrance hebt nur WENIG gesaettigte Pixel an (Himmel, Beton, Gras) und laesst
; bereits knallige Roblox-Parts in Ruhe - deshalb 0.15 hier mehr bringt als
; 0.15 globale Saettigung. RoShade hatte 0.403 mit RGB-Balance 2/1/1; das
; clippt und legt einen Rotstich ueber alles. Balance bleibt neutral.
[Vibrance.fx]
Vibrance=0.150000
VibranceRGBBalance=1.000000,1.000000,1.000000

; --- Kontrast ---------------------------------------------------------------
; Formula 4 = Sine: die weichste S-Kurve, saeuft in den Schatten nicht ab.
; Mode 0 = nur Luma, damit der Kontrast nicht als Nebenwirkung die Saettigung
;   nach oben zieht (sonst stapelt es sich mit Tonemap + Vibrance).
; Contrast 0.30 statt 0.65 (RoShade): Curves laeuft NACH MXAO, das die
;   Schatten bereits abgedunkelt hat. Die beiden Effekte multiplizieren sich -
;   0.65 obendrauf frisst die Schattenzeichnung komplett.
[Curves.fx]
Contrast=0.300000
Formula=4
Mode=0

; --- Schaerfen --------------------------------------------------------------
; CAS statt LumaSharpen: schaerft dort weniger, wo ohnehin viel Kontrast ist,
; erzeugt also keine Halos an Roblox' harten Kanten und an der UI.
; Sharpening 0.45 gegen den weichen Roblox-Look. Ab ~0.70 sieht man Ringing
; an Textkanten. Contrast 0.0 = maximale Adaptivitaet.
[CAS.fx]
Contrast=0.000000
Sharpening=0.450000

; ============================================================================
;  Ab hier: vorkonfiguriert, aber NICHT in Techniques= => standardmaessig AUS.
;  In der ReShade-UI (Home) per Haken zuschaltbar.
; ============================================================================

; --- Depth of Field (optional, ~2-3 ms) -------------------------------------
; ShapeRadius 14 statt 50 (RoShade) und Quality 8 statt 14. Radius 50 ist
; "Vaseline auf der Linse" und in einem Spiel, in dem man sich staendig
; bewegt, schlicht unspielbar. HyperFocus 0.10 haelt den Nahbereich (dein
; eigener Avatar) scharf.
[qUINT_dof.fx]
bADOF_AutofocusEnable=1
fADOF_AutofocusCenter=0.500000,0.500000
fADOF_AutofocusRadius=0.020000
fADOF_AutofocusSpeed=0.250000
fADOF_ManualfocusDepth=0.050000
fADOF_HyperFocus=0.100000
fADOF_NearBlurCurve=2.000000
fADOF_FarBlurCurve=2.500000
fADOF_ShapeRadius=14.000000
fADOF_BokehIntensity=0.150000
fADOF_ShapeAnamorphRatio=1.000000
fADOF_ShapeChromaAmount=0.000000
fADOF_ShapeCurvatureAmount=0.000000
fADOF_ShapeRotation=0.000000
fADOF_ShapeVignetteAmount=0.000000
fADOF_ShapeVignetteCurve=1.000000
fADOF_SmootheningAmount=1.000000
fADOF_RenderResolutionMult=1.000000
iADOF_BokehMode=2
iADOF_ShapeChromaMode=0
iADOF_ShapeQuality=8
iADOF_ShapeVertices=6

; --- Echtes SSR (optional, ~4 ms) -------------------------------------------
; Nur zuschalten, wenn RBM nicht reicht - und dann RBM abschalten, sonst
; liegen zwei Reflexionsschichten uebereinander (so sah RoShade High aus).
[qUINT_ssr.fx]
SSR_REFLECTION_INTENSITY=0.400000
SSR_FRESNEL_EXP=3.000000
SSR_ACCEPT_RANGE=2.000000
SSR_RAY_INC=2.000000
SSR_JITTER_AMOUNT=0.300000
SSR_FILTER_SIZE=0.300000
SSR_FADE_DIST=0.500000
SSR_FIELD_OF_VIEW=70.000000
SSR_RELIEF_AMOUNT=0.600000
SSR_RELIEF_SCALE=1.000000

; --- Alternative Schaerfer (optional) ---------------------------------------
[LumaSharpen.fx]
pattern=1
sharp_strength=0.500000
sharp_clamp=0.035000
offset_bias=1.000000
show_sharpen=0

[qUINT_sharp.fx]
SHARPEN_MODE=1
SHARP_STRENGTH=0.600000
DEPTH_MASK_ENABLE=1
RMS_MASK_ENABLE=0

; --- Farbgrading-Knopf fuer eigene Anpassungen (neutral, optional) ----------
[LiftGammaGain.fx]
RGB_Lift=1.000000,1.000000,1.000000
RGB_Gamma=1.000000,1.000000,1.000000
RGB_Gain=1.000000,1.000000,1.000000

; --- Diagnose ---------------------------------------------------------------
[DisplayDepth.fx]
iUIPresentType=0
iUIUpsideDown=0
iUIReversed=1
iUILogarithmic=0
fUIFarPlane=1000.000000
