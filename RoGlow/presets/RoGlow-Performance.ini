; ============================================================================
;  RoGlow - Performance  (Laptop-iGPU, GTX 1050, oder wenn Balanced ruckelt)
;  Budget: ca. 0.5-0.8 ms  =>  bei 100 FPS bleiben ~95 FPS.
;
;  Bewusst OHNE MXAO und OHNE Reflexionen: beide brauchen den Depth-Buffer und
;  sind zusammen ueber 80% der Kosten von Balanced. Was bleibt, sind reine
;  Full-Screen-Pixeloperationen - die kosten fast nichts und machen trotzdem
;  den groessten Teil des sichtbaren Unterschieds aus (Kontrast, Farbe,
;  Schaerfe).
; ============================================================================

Techniques=Bloom@qUINT_bloom.fx,Tonemap@Tonemap.fx,Vibrance@Vibrance.fx,Curves@Curves.fx,ContrastAdaptiveSharpen@CAS.fx
TechniqueSorting=MXAO@qUINT_mxao.fx,SSR@qUINT_ssr.fx,ReflectiveBumpmapping@ReflectiveBumpMapping.fx,Bloom@qUINT_bloom.fx,Tonemap@Tonemap.fx,Vibrance@Vibrance.fx,Curves@Curves.fx,LiftGammaGain@LiftGammaGain.fx,ContrastAdaptiveSharpen@CAS.fx,LumaSharpen@LumaSharpen.fx,DELC_Sharpen@qUINT_sharp.fx,ADOF@qUINT_dof.fx,DisplayDepth@DisplayDepth.fx

PreprocessorDefinitions=RESHADE_DEPTH_INPUT_IS_REVERSED=1,RESHADE_DEPTH_INPUT_IS_UPSIDE_DOWN=0,RESHADE_DEPTH_INPUT_IS_LOGARITHMIC=0,RESHADE_DEPTH_LINEARIZATION_FAR_PLANE=1000.0,MXAO_ENABLE_IL=0,MXAO_SMOOTHNORMALS=0,MXAO_HIGH_QUALITY=0,MXAO_TWO_LAYER=0,MXAO_MIPLEVEL_AO=0,MXAO_MIPLEVEL_IL=2,MATERIAL_TYPE=0

; Bloom noch etwas zurueckhaltender und nur auf den engsten Layern - die
; grossen Mip-Layer sind auch die teuersten Blur-Passes.
[qUINT_bloom.fx]
BLOOM_INTENSITY=0.450000
BLOOM_CURVE=2.400000
BLOOM_SAT=1.250000
BLOOM_TONEMAP_COMPRESSION=4.000000
BLOOM_LAYER_MULT_1=0.350000
BLOOM_LAYER_MULT_2=0.250000
BLOOM_LAYER_MULT_3=0.150000
BLOOM_LAYER_MULT_4=0.080000
BLOOM_LAYER_MULT_5=0.020000
BLOOM_LAYER_MULT_6=0.000000
BLOOM_LAYER_MULT_7=0.000000
BLOOM_ADAPT_EXPOSURE=0.000000
BLOOM_ADAPT_SPEED=2.000000
BLOOM_ADAPT_STRENGTH=0.000000

[Tonemap.fx]
Gamma=1.000000
Exposure=0.000000
Saturation=0.120000
Bleach=0.000000
Defog=0.000000
FogColor=0.000000,0.000000,1.000000

; Etwas mehr Vibrance/Kontrast als in Balanced, weil hier kein AO die Tiefe
; liefert - der Eindruck von Plastizitaet muss aus der Tonwertkurve kommen.
[Vibrance.fx]
Vibrance=0.200000
VibranceRGBBalance=1.000000,1.000000,1.000000

[Curves.fx]
Contrast=0.400000
Formula=4
Mode=0

[CAS.fx]
Contrast=0.000000
Sharpening=0.500000

; --- Nicht aktiv, aber konfiguriert -----------------------------------------
[qUINT_mxao.fx]
MXAO_GLOBAL_SAMPLE_QUALITY_PRESET=0
MXAO_GLOBAL_RENDER_SCALE=0.500000
MXAO_SAMPLE_RADIUS=1.800000
MXAO_SAMPLE_RADIUS_SECONDARY=0.200000
MXAO_SAMPLE_NORMAL_BIAS=0.250000
MXAO_SSAO_AMOUNT=0.550000
MXAO_SSIL_AMOUNT=0.000000
MXAO_SSIL_SATURATION=1.000000
MXAO_BLEND_TYPE=1
MXAO_FADE_DEPTH_START=0.050000
MXAO_FADE_DEPTH_END=0.250000
MXAO_DEBUG_VIEW_ENABLE=0

[ReflectiveBumpMapping.fx]
; 16 ist das Minimum, das der Shader zulaesst - darunter klemmt ReShade den
; Wert ohnehin. Gespart wird hier ueber die kleinere Blur-Breite.
iRBM_SampleCount=16
fRBM_BlurWidthPixels=48.000000
fRBM_FresnelMult=0.200000
fRBM_FresnelReflectance=0.150000
fRBM_ReliefHeight=0.250000
fRBM_LowerThreshold=0.050000
fRBM_UpperThreshold=0.700000
fRBM_ColorMask_Red=0.500000
fRBM_ColorMask_Orange=0.700000
fRBM_ColorMask_Yellow=0.500000
fRBM_ColorMask_Green=0.500000
fRBM_ColorMask_Cyan=1.000000
fRBM_ColorMask_Blue=1.000000
fRBM_ColorMask_Magenta=0.500000

[LumaSharpen.fx]
pattern=1
sharp_strength=0.500000
sharp_clamp=0.035000
offset_bias=1.000000
show_sharpen=0

[LiftGammaGain.fx]
RGB_Lift=1.000000,1.000000,1.000000
RGB_Gamma=1.000000,1.000000,1.000000
RGB_Gain=1.000000,1.000000,1.000000

[DisplayDepth.fx]
iUIPresentType=0
iUIUpsideDown=0
iUIReversed=1
iUILogarithmic=0
fUIFarPlane=1000.000000
