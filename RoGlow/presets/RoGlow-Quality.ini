; ============================================================================
;  RoGlow - Quality  (RTX 4070 / 7800 XT aufwaerts, 1440p+)
;  Budget: ca. 8-11 ms  =>  bei 100 FPS bleiben ~50-55 FPS.
;  Gedacht fuer Screenshots und ruhige Spielmodi, nicht fuer Obbys/PvP.
;
;  Unterschied zu Balanced:
;   - echtes qUINT SSR statt Reflective Bump Mapping (raymarched, korrekte
;     Reflexionsgeometrie statt Luminanz-Trick)
;   - MXAO auf voller Aufloesung, Quality-Preset 2, Indirect Lighting an
;   - Depth of Field aktiv
;
;  WICHTIG: SSR und RBM laufen hier NICHT zusammen. Beide gleichzeitig legt
;  zwei Reflexionsschichten uebereinander - das ist der Grund, warum das
;  originale "RoShade High" so ueberzogen wirkt.
; ============================================================================

Techniques=MXAO@qUINT_mxao.fx,SSR@qUINT_ssr.fx,Bloom@qUINT_bloom.fx,Tonemap@Tonemap.fx,Vibrance@Vibrance.fx,Curves@Curves.fx,ADOF@qUINT_dof.fx,ContrastAdaptiveSharpen@CAS.fx
TechniqueSorting=MXAO@qUINT_mxao.fx,SSR@qUINT_ssr.fx,ReflectiveBumpmapping@ReflectiveBumpMapping.fx,Bloom@qUINT_bloom.fx,Tonemap@Tonemap.fx,Vibrance@Vibrance.fx,Curves@Curves.fx,LiftGammaGain@LiftGammaGain.fx,ADOF@qUINT_dof.fx,ContrastAdaptiveSharpen@CAS.fx,LumaSharpen@LumaSharpen.fx,DELC_Sharpen@qUINT_sharp.fx,DisplayDepth@DisplayDepth.fx

; Hier ist MXAO_ENABLE_IL=1 vertretbar - die GPU hat das Budget.
PreprocessorDefinitions=RESHADE_DEPTH_INPUT_IS_REVERSED=1,RESHADE_DEPTH_INPUT_IS_UPSIDE_DOWN=0,RESHADE_DEPTH_INPUT_IS_LOGARITHMIC=0,RESHADE_DEPTH_LINEARIZATION_FAR_PLANE=1000.0,MXAO_ENABLE_IL=1,MXAO_SMOOTHNORMALS=1,MXAO_HIGH_QUALITY=1,MXAO_TWO_LAYER=0,MXAO_MIPLEVEL_AO=0,MXAO_MIPLEVEL_IL=2,MATERIAL_TYPE=0

; SSIL_AMOUNT 0.35 statt RoShades 0.50-5.15: Indirect Lighting ist ein
; Effekt, den man spuert und nicht sieht. Ueber ~0.5 kippt es in bunte
; Farbverschmierung an Waenden.
[qUINT_mxao.fx]
MXAO_GLOBAL_SAMPLE_QUALITY_PRESET=2
MXAO_GLOBAL_RENDER_SCALE=1.000000
MXAO_SAMPLE_RADIUS=2.500000
MXAO_SAMPLE_RADIUS_SECONDARY=0.200000
MXAO_SAMPLE_NORMAL_BIAS=0.150000
MXAO_SSAO_AMOUNT=0.750000
MXAO_SSIL_AMOUNT=0.350000
MXAO_SSIL_SATURATION=1.100000
MXAO_BLEND_TYPE=1
MXAO_FADE_DEPTH_START=0.050000
MXAO_FADE_DEPTH_END=0.500000
MXAO_DEBUG_VIEW_ENABLE=0

; REFLECTION_INTENSITY 0.45: RoShade High hatte 0.60 zusaetzlich zu RBM.
; Alleinstehend reichen 0.45 fuer deutlich sichtbare Spiegelungen auf Boeden
; und Wasser, ohne dass Roblox aussieht wie eine Eisbahn.
; FRESNEL_EXP 3.0: Reflexionen erscheinen erst bei flachem Blickwinkel -
; physikalisch korrekter und verhindert, dass senkrechte Waende spiegeln.
[qUINT_ssr.fx]
SSR_REFLECTION_INTENSITY=0.450000
SSR_FRESNEL_EXP=3.000000
SSR_ACCEPT_RANGE=2.200000
SSR_RAY_INC=1.800000
SSR_JITTER_AMOUNT=0.350000
SSR_FILTER_SIZE=0.350000
SSR_FADE_DIST=0.550000
SSR_FIELD_OF_VIEW=70.000000
SSR_RELIEF_AMOUNT=0.800000
SSR_RELIEF_SCALE=1.000000

[qUINT_bloom.fx]
BLOOM_INTENSITY=0.700000
BLOOM_CURVE=2.000000
BLOOM_SAT=1.400000
BLOOM_TONEMAP_COMPRESSION=4.000000
BLOOM_LAYER_MULT_1=0.300000
BLOOM_LAYER_MULT_2=0.250000
BLOOM_LAYER_MULT_3=0.200000
BLOOM_LAYER_MULT_4=0.140000
BLOOM_LAYER_MULT_5=0.080000
BLOOM_LAYER_MULT_6=0.030000
BLOOM_LAYER_MULT_7=0.010000
BLOOM_ADAPT_EXPOSURE=0.000000
BLOOM_ADAPT_SPEED=2.000000
BLOOM_ADAPT_STRENGTH=0.000000

[Tonemap.fx]
Gamma=1.000000
Exposure=0.000000
Saturation=0.100000
Bleach=0.000000
Defog=0.000000
FogColor=0.000000,0.000000,1.000000

[Vibrance.fx]
Vibrance=0.130000
VibranceRGBBalance=1.000000,1.000000,1.000000

; Etwas weniger Kontrast als Balanced, weil MXAO hier staerker laeuft und
; die Schatten schon selbst abdunkelt.
[Curves.fx]
Contrast=0.250000
Formula=4
Mode=0

[qUINT_dof.fx]
bADOF_AutofocusEnable=1
fADOF_AutofocusCenter=0.500000,0.500000
fADOF_AutofocusRadius=0.020000
fADOF_AutofocusSpeed=0.250000
fADOF_ManualfocusDepth=0.050000
fADOF_HyperFocus=0.100000
fADOF_NearBlurCurve=2.000000
fADOF_FarBlurCurve=2.500000
fADOF_ShapeRadius=18.000000
fADOF_BokehIntensity=0.250000
fADOF_ShapeAnamorphRatio=1.000000
fADOF_ShapeChromaAmount=0.000000
fADOF_ShapeCurvatureAmount=0.000000
fADOF_ShapeRotation=0.000000
fADOF_ShapeVignetteAmount=0.000000
fADOF_ShapeVignetteCurve=1.000000
fADOF_SmootheningAmount=1.000000
fADOF_RenderResolutionMult=1.000000
iADOF_BokehMode=2
iADOF_ShapeChromaMode=0
iADOF_ShapeQuality=11
iADOF_ShapeVertices=6

; Weniger Schaerfe als Balanced: bei 1440p+ ist das Bild ohnehin schaerfer,
; und DoF davor wuerde durch starkes CAS teilweise wieder aufgehoben.
[CAS.fx]
Contrast=0.000000
Sharpening=0.350000

; --- Nicht aktiv ------------------------------------------------------------
[ReflectiveBumpMapping.fx]
iRBM_SampleCount=16
fRBM_BlurWidthPixels=64.000000
fRBM_FresnelMult=0.220000
fRBM_FresnelReflectance=0.180000
fRBM_ReliefHeight=0.300000
fRBM_LowerThreshold=0.050000
fRBM_UpperThreshold=0.700000
fRBM_ColorMask_Red=0.500000
fRBM_ColorMask_Orange=0.700000
fRBM_ColorMask_Yellow=0.500000
fRBM_ColorMask_Green=0.500000
fRBM_ColorMask_Cyan=1.000000
fRBM_ColorMask_Blue=1.000000
fRBM_ColorMask_Magenta=0.500000

[LumaSharpen.fx]
pattern=1
sharp_strength=0.400000
sharp_clamp=0.035000
offset_bias=1.000000
show_sharpen=0

[LiftGammaGain.fx]
RGB_Lift=1.000000,1.000000,1.000000
RGB_Gamma=1.000000,1.000000,1.000000
RGB_Gain=1.000000,1.000000,1.000000

[DisplayDepth.fx]
iUIPresentType=0
iUIUpsideDown=0
iUIReversed=1
iUILogarithmic=0
fUIFarPlane=1000.000000
