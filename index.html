<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#79c6f2">
<title>Flappy 3D – Vogelperspektive</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#79c6f2;
              font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
              touch-action:none; overscroll-behavior:none; user-select:none; -webkit-user-select:none; }
  #game { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .overlay { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
             justify-content:center; text-align:center; z-index:10; padding:20px;
             padding-top:calc(20px + env(safe-area-inset-top)); }
  .hidden { display:none !important; }
  .title { font-size:clamp(38px,9vw,64px); font-weight:900; color:#fff; letter-spacing:2px;
           text-shadow:0 4px 0 #d9860b, 0 8px 18px rgba(0,0,0,.35); margin-bottom:4px;
           animation:bob 2.4s ease-in-out infinite; }
  .subtitle { color:#fff; font-weight:600; text-shadow:0 2px 6px rgba(0,0,0,.3); margin-bottom:26px;
              font-size:clamp(14px,3.5vw,18px); }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  .card { background:rgba(255,255,255,.14); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
          border:1px solid rgba(255,255,255,.35); border-radius:22px; padding:22px 26px;
          box-shadow:0 12px 34px rgba(0,0,0,.25); max-width:340px; width:100%; }
  .modeRow { display:flex; gap:10px; margin-bottom:18px; }
  .modeBtn { flex:1; padding:14px 8px; border-radius:14px; border:2px solid rgba(255,255,255,.5);
             background:rgba(255,255,255,.15); color:#fff; font-weight:800; font-size:15px;
             cursor:pointer; transition:all .15s; line-height:1.25; }
  .modeBtn small { display:block; font-weight:500; font-size:11px; opacity:.85; margin-top:3px; }
  .modeBtn.active { background:#ffd93b; color:#5c3a00; border-color:#fff;
                    box-shadow:0 4px 0 #d9860b, 0 8px 16px rgba(0,0,0,.25); transform:translateY(-2px); }
  .bigBtn { width:100%; padding:16px; border-radius:16px; border:none; cursor:pointer;
            background:linear-gradient(#8ee060,#4caf3f); color:#fff; font-size:22px; font-weight:900;
            letter-spacing:1px; box-shadow:0 5px 0 #2e7d28, 0 10px 20px rgba(0,0,0,.3);
            transition:transform .1s; }
  .bigBtn:active { transform:translateY(4px); box-shadow:0 1px 0 #2e7d28; }
  .best { color:#fff; font-weight:700; margin-top:16px; text-shadow:0 2px 4px rgba(0,0,0,.3); font-size:15px; }
  .soundBtn { margin-top:12px; background:none; border:none; font-size:22px; cursor:pointer;
              color:#fff; opacity:.9; }
  .hint { color:rgba(255,255,255,.9); font-size:12px; margin-top:14px; text-shadow:0 1px 3px rgba(0,0,0,.3); }
  #hud { position:fixed; top:calc(14px + env(safe-area-inset-top)); left:0; right:0; text-align:center;
         z-index:5; pointer-events:none; }
  #score { font-size:clamp(44px,11vw,74px); font-weight:900; color:#fff;
           text-shadow:0 3px 0 rgba(0,0,0,.35), 0 6px 14px rgba(0,0,0,.3); }
  #goCard h2 { color:#fff; font-size:34px; font-weight:900; text-shadow:0 3px 0 rgba(0,0,0,.3); margin-bottom:8px; }
  .medal { font-size:52px; margin:4px 0 8px; }
  .scoreRow { display:flex; justify-content:space-between; color:#fff; font-weight:700;
              font-size:17px; margin:6px 0; text-shadow:0 1px 3px rgba(0,0,0,.3); }
  .scoreRow span:last-child { font-size:22px; }
  .newBest { color:#ffd93b; font-weight:900; font-size:14px; margin-bottom:10px;
             animation:bob 1s ease-in-out infinite; }
  .btnRow { display:flex; gap:10px; margin-top:14px; }
  .btnRow .bigBtn { font-size:17px; padding:13px; }
  .btnRow .secondary { background:linear-gradient(#7fc0ee,#3d8fce); box-shadow:0 5px 0 #23648f, 0 10px 20px rgba(0,0,0,.3); }
  #tapHint { position:fixed; bottom:calc(12vh + env(safe-area-inset-bottom)); left:0; right:0; text-align:center;
             color:#fff; font-weight:800; font-size:20px; text-shadow:0 2px 6px rgba(0,0,0,.4);
             z-index:5; pointer-events:none; animation:bob 1.2s ease-in-out infinite; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden"><div id="score">0</div></div>
<div id="tapHint" class="hidden">▲ Tippen zum Fliegen ▲</div>

<div id="lobby" class="overlay">
  <div class="title">FLAPPY 3D</div>
  <div class="subtitle">Flieg als Vogel durch die Röhren!</div>
  <div class="card">
    <div class="modeRow">
      <button id="btn3d" class="modeBtn active">🐦 3D<small>Vogel&#8209;Perspektive</small></button>
      <button id="btn2d" class="modeBtn">🎮 2D<small>Klassisch</small></button>
    </div>
    <button id="btnStart" class="bigBtn">START ▶</button>
    <div class="best">🏆 Rekord: <span id="bestLobby">0</span></div>
    <button id="btnSound" class="soundBtn">🔊</button>
    <div class="hint">Tippen / Klicken / Leertaste = Flügelschlag</div>
  </div>
</div>

<div id="gameover" class="overlay hidden">
  <div class="card" id="goCard">
    <h2>Game Over</h2>
    <div class="medal" id="medal">🥉</div>
    <div id="newBestTag" class="newBest hidden">★ NEUER REKORD! ★</div>
    <div class="scoreRow"><span>Punkte</span><span id="finalScore">0</span></div>
    <div class="scoreRow"><span>Rekord</span><span id="finalBest">0</span></div>
    <div class="btnRow">
      <button id="btnRetry" class="bigBtn">Nochmal</button>
      <button id="btnLobby" class="bigBtn secondary">Lobby</button>
    </div>
  </div>
</div>

<script>
'use strict';
/* ============================================================
   FLAPPY 3D — Vogelperspektive (Ego-Ansicht) & klassisches 2D
   Eine Datei, keine Abhängigkeiten. Canvas-2D-Software-3D.
   ============================================================ */

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

/* ---------- Hilfsfunktionen ---------- */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
// deterministischer Pseudozufall für wiederholbare Deko
function hash(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
function mixRGB(c1, c2, t) {
  return 'rgb(' + Math.round(lerp(c1[0], c2[0], t)) + ',' +
                  Math.round(lerp(c1[1], c2[1], t)) + ',' +
                  Math.round(lerp(c1[2], c2[2], t)) + ')';
}

/* ---------- Sound (WebAudio, winzig) ---------- */
let audioCtx = null, soundOn = localStorage.getItem('flappySound') !== '0';
function beep(freq, dur, type, vol, slide) {
  if (!soundOn) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, audioCtx.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, audioCtx.currentTime + dur);
    g.gain.setValueAtTime(vol || 0.08, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}
const sndFlap  = () => beep(340, 0.09, 'square', 0.05, 500);
const sndScore = () => { beep(660, 0.09, 'square', 0.06); setTimeout(() => beep(880, 0.12, 'square', 0.06), 80); };
const sndHit   = () => beep(220, 0.35, 'sawtooth', 0.1, 60);

/* ---------- Spielzustand ---------- */
const GRAV = 30, FLAP = 10.5, PIPE_R = 1.6, BIRD_R = 0.42;
const PIPE_SPACING = 18, WORLD_TOP = 13, FOG_FAR = 95;
let mode = localStorage.getItem('flappyMode') || '3d';
let state = 'lobby';                  // lobby | ready | play | dying | over
let best = +(localStorage.getItem('flappyBest') || 0);
let score = 0, dist = 0, speed = 13;
let bird = { y: 6.5, vy: 0, z: 0 };
let pipes = [], lastPipeZ = 40;
let flapAnim = 0, deathTimer = 0, shake = 0, flash = 0, time = 0;

function resetGame() {
  bird = { y: 6.5, vy: 0, z: 0 };
  pipes = []; lastPipeZ = 40;
  score = 0; dist = 0; speed = 13;
  flapAnim = 0; deathTimer = 0; shake = 0; flash = 0;
  spawnPipes(); initDeco();
}
function spawnPipes() {
  while (lastPipeZ < bird.z + 140) {
    const gapH = clamp(4.6 - score * 0.05, 3.4, 4.6);
    const gapY = 3 + hash(lastPipeZ * 0.77) * (WORLD_TOP - 6);
    pipes.push({ z: lastPipeZ, gapY, gapH, scored: false });
    lastPipeZ += PIPE_SPACING;
  }
  while (pipes.length && pipes[0].z < bird.z - 8) pipes.shift();
}

/* ---------- Deko-Objekte (die "unnützen" Details 🌼) ---------- */
let deco = [], clouds = [], birdsFlock = [], balloons = [], particles = [];
function initDeco() {
  deco = []; clouds = []; birdsFlock = []; balloons = []; particles = [];
  for (let i = 0; i < 46; i++) spawnDeco(bird.z + 5 + i * 3.2);
  for (let i = 0; i < 10; i++)
    clouds.push({ x: (hash(i * 3.1) - 0.5) * 160, y: 14 + hash(i * 7.7) * 14,
                  z: bird.z + 20 + hash(i * 5.3) * 200, s: 3 + hash(i * 9.1) * 5 });
  for (let i = 0; i < 3; i++)
    balloons.push({ x: (hash(i * 13.7) - 0.5) * 70, y: 9 + hash(i * 17.3) * 6,
                    z: bird.z + 60 + i * 60, hue: Math.floor(hash(i * 23.9) * 360), ph: hash(i) * TAU });
  for (let i = 0; i < 5; i++)
    birdsFlock.push({ x: -20 + hash(i * 31.1) * 40, y: 8 + hash(i * 37.7) * 5,
                      z: bird.z + 40 + hash(i * 41.3) * 80, ph: hash(i * 43) * TAU, vx: 2 + hash(i * 47) * 2 });
}
function spawnDeco(z) {
  const r = hash(z * 1.313);
  const side = hash(z * 2.71) < 0.5 ? -1 : 1;
  const x = side * (6 + hash(z * 3.9) * 26);
  let type = 'tree';
  if (r < 0.14) type = 'windmill';
  else if (r < 0.3) type = 'flower';
  else if (r < 0.42) type = 'rock';
  else if (r < 0.52) type = 'bush';
  else if (r < 0.58) type = 'house';
  deco.push({ type, x, z, v: hash(z * 5.5) });
}
function updateDeco(dt) {
  // recyceln: was hinter uns liegt, nach vorn verschieben
  for (const d of deco) if (d.z < bird.z - 6) { d.z += 46 * 3.2; d.x = (hash(d.z * 2.71) < 0.5 ? -1 : 1) * (6 + hash(d.z * 3.9) * 26); }
  for (const c of clouds) { c.x += dt * 0.5; if (c.z < bird.z - 10) c.z += 220; }
  for (const b of balloons) { b.ph += dt * 0.4; if (b.z < bird.z - 10) b.z += 180; }
  for (const f of birdsFlock) {
    f.ph += dt * 8; f.x += f.vx * dt;
    if (f.x > 30) f.x = -30;
    if (f.z < bird.z - 5) f.z += 120;
  }
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy -= 12 * dt; p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

/* ---------- Physik ---------- */
function flap() {
  if (state === 'ready') { state = 'play'; document.getElementById('tapHint').classList.add('hidden'); }
  if (state !== 'play') return;
  bird.vy = FLAP; flapAnim = 1; sndFlap();
  for (let i = 0; i < 4; i++)
    particles.push({ x: (Math.random() - 0.5) * 0.6, y: bird.y - 0.3, z: bird.z,
                     vx: (Math.random() - 0.5) * 3, vy: -2 - Math.random() * 2, life: 0.5 + Math.random() * 0.3 });
}
function die() {
  if (state !== 'play') return;
  state = 'dying'; deathTimer = 0; shake = 1; flash = 1; sndHit();
  if (navigator.vibrate) navigator.vibrate(80);
}
function update(dt) {
  time += dt;
  if (state === 'ready') { bird.y = 6.5 + Math.sin(time * 3) * 0.25; }
  if (state === 'play') {
    speed = 13 + Math.min(score * 0.12, 6);
    bird.vy -= GRAV * dt;
    bird.y += bird.vy * dt;
    bird.z += speed * dt; dist += speed * dt;
    if (bird.y > WORLD_TOP) { bird.y = WORLD_TOP; bird.vy = Math.min(bird.vy, 0); }
    if (bird.y - BIRD_R <= 0) { bird.y = BIRD_R; die(); }
    spawnPipes();
    for (const p of pipes) {
      if (!p.scored && bird.z > p.z) { p.scored = true; score++; sndScore(); document.getElementById('score').textContent = score; }
      if (Math.abs(p.z - bird.z) < PIPE_R + BIRD_R * 0.6) {
        if (bird.y - BIRD_R < p.gapY - p.gapH / 2 || bird.y + BIRD_R > p.gapY + p.gapH / 2) die();
      }
    }
  }
  if (state === 'dying') {
    deathTimer += dt;
    bird.vy -= GRAV * dt; bird.y += bird.vy * dt;
    if (bird.y < BIRD_R) bird.y = BIRD_R;
    if (deathTimer > 1) gameOver();
  }
  flapAnim = Math.max(0, flapAnim - dt * 3.2);
  shake = Math.max(0, shake - dt * 2.5);
  flash = Math.max(0, flash - dt * 3);
  updateDeco(dt);
}

/* ============================================================
   3D-RENDERER — Ego-Perspektive aus Sicht des Vogels
   ============================================================ */
function skyColors() {
  // sanfter Tag→Abend→Tag-Zyklus über die Flugstrecke (nur ein Detail 😉)
  const t = (Math.sin(dist / 900 * TAU - Math.PI / 2) + 1) / 2; // 0=Tag 1=Abend
  return {
    top: [lerp(94, 46, t), lerp(174, 58, t), lerp(240, 130, t)],
    bot: [lerp(184, 250, t), lerp(226, 160, t), lerp(250, 110, t)],
    fog: [lerp(200, 250, t), lerp(230, 180, t), lerp(250, 140, t)],
    evening: t
  };
}
function render3D() {
  const sky = skyColors();
  const f = Math.min(W, H) * 1.15;
  const cx = W / 2;
  const tilt = clamp(-bird.vy * 5, -H * 0.07, H * 0.09);
  const cy = H * 0.48 + tilt + (shake ? (Math.random() - 0.5) * shake * 24 : 0);
  const camY = bird.y, camZ = bird.z;
  const horizon = cy + camY * f / FOG_FAR;

  // Himmel
  const g = ctx.createLinearGradient(0, 0, 0, horizon);
  g.addColorStop(0, mixRGB(sky.top, sky.top, 0));
  g.addColorStop(1, mixRGB(sky.bot, sky.bot, 0));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, Math.max(horizon, 0) + 2);

  // Sonne mit Glow
  const sunX = W * 0.72, sunY = cy - H * 0.26;
  const sg = ctx.createRadialGradient(sunX, sunY, 4, sunX, sunY, H * 0.22);
  sg.addColorStop(0, 'rgba(255,250,200,0.95)');
  sg.addColorStop(0.25, sky.evening > 0.5 ? 'rgba(255,160,80,0.5)' : 'rgba(255,240,170,0.45)');
  sg.addColorStop(1, 'rgba(255,240,170,0)');
  ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(sunX, sunY, H * 0.22, 0, TAU); ctx.fill();
  ctx.fillStyle = '#fffbe0'; ctx.beginPath(); ctx.arc(sunX, sunY, H * 0.035, 0, TAU); ctx.fill();

  // ferne Berge (2 Ebenen, leichte Parallaxe)
  drawMountains(horizon, cx, sky, 0.00014, 0.55, 26, [126, 152, 196], [200, 120, 150]);
  drawMountains(horizon, cx, sky, 0.0004, 0.8, 17, [104, 150, 128], [170, 110, 120]);

  // Boden
  const gg = ctx.createLinearGradient(0, horizon, 0, H);
  gg.addColorStop(0, mixRGB([150, 200, 130], sky.fog, 0.75));
  gg.addColorStop(0.35, mixRGB([116, 188, 92], sky.fog, 0.2));
  gg.addColorStop(1, mixRGB([86, 160, 66], [60, 120, 50], sky.evening * 0.4));
  ctx.fillStyle = gg; ctx.fillRect(0, Math.max(horizon, 0), W, H - horizon);

  // Bodenstreifen → Geschwindigkeitsgefühl
  ctx.strokeStyle = 'rgba(0,80,0,0.10)'; ctx.lineWidth = 2;
  for (let i = 0; i < 22; i++) {
    const wz = Math.ceil(camZ / 4) * 4 + i * 4;
    const dz = wz - camZ; if (dz < 1) continue;
    const sy = cy + camY * f / dz;
    if (sy < horizon || sy > H) continue;
    ctx.globalAlpha = clamp(1 - dz / FOG_FAR, 0, 1) * 0.8;
    ctx.beginPath(); ctx.moveTo(0, sy); ctx.lineTo(W, sy); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // Alles mit z-Position sammeln, fern→nah zeichnen
  const items = [];
  for (const c of clouds)     items.push({ z: c.z, fn: () => drawCloud3D(c, f, cx, cy, camY, camZ, sky) });
  for (const b of balloons)   items.push({ z: b.z, fn: () => drawBalloon3D(b, f, cx, cy, camY, camZ, sky) });
  for (const fb of birdsFlock)items.push({ z: fb.z, fn: () => drawBird3D(fb, f, cx, cy, camY, camZ, sky) });
  for (const d of deco)       items.push({ z: d.z, fn: () => drawDeco3D(d, f, cx, cy, camY, camZ, sky) });
  for (const p of pipes)      items.push({ z: p.z, fn: () => drawPipe3D(p, f, cx, cy, camY, camZ, sky) });
  for (const pt of particles) items.push({ z: pt.z, fn: () => drawParticle3D(pt, f, cx, cy, camY, camZ) });
  items.sort((a, b) => b.z - a.z);
  for (const it of items) if (it.z - camZ > 0.5 && it.z - camZ < 260) it.fn();

  drawWings();

  if (flash > 0) { ctx.fillStyle = `rgba(255,60,40,${flash * 0.35})`; ctx.fillRect(0, 0, W, H); }
}
function drawMountains(horizon, cx, sky, freqScale, para, hgt, colDay, colEve) {
  const col = mixRGB(mixRGB2(colDay, colEve, sky.evening), sky.fog, 0.45);
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.moveTo(0, horizon + 2);
  const off = dist * para;
  for (let x = 0; x <= W; x += 14) {
    const n = hash(Math.floor((x + off * 40) * freqScale * 500)) * 0.6
            + hash(Math.floor((x + off * 40) * freqScale * 1100)) * 0.4;
    ctx.lineTo(x, horizon + 2 - n * hgt * (H / 700));
  }
  ctx.lineTo(W, horizon + 2); ctx.closePath(); ctx.fill();
}
function mixRGB2(a, b, t) { return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)]; }

function proj(f, cx, cy, camY, camZ, x, y, z) {
  const dz = z - camZ;
  return { x: cx + x * f / dz, y: cy - (y - camY) * f / dz, s: f / dz, dz };
}
function fogT(dz) { return clamp(dz / FOG_FAR, 0, 1); }

function drawPipe3D(p, f, cx, cy, camY, camZ, sky) {
  const dz = p.z - camZ; if (dz < 0.6) return;
  const s = f / dz, hw = PIPE_R * s;
  const px = cx;
  const t = fogT(dz);
  const bodyL = mixRGB([46, 160, 60], sky.fog, t), bodyM = mixRGB([120, 220, 110], sky.fog, t),
        bodyD = mixRGB([30, 110, 40], sky.fog, t), rim = mixRGB([26, 95, 34], sky.fog, t);
  const yGapTop = cy - (p.gapY + p.gapH / 2 - camY) * f / dz;
  const yGapBot = cy - (p.gapY - p.gapH / 2 - camY) * f / dz;
  const yTop = cy - (WORLD_TOP + 6 - camY) * f / dz;
  const yGround = cy - (0 - camY) * f / dz;
  const grad = ctx.createLinearGradient(px - hw, 0, px + hw, 0);
  grad.addColorStop(0, bodyD); grad.addColorStop(0.35, bodyM); grad.addColorStop(0.7, bodyL); grad.addColorStop(1, bodyD);

  // oberes Rohr
  ctx.fillStyle = grad;
  ctx.fillRect(px - hw, yTop, hw * 2, yGapTop - yTop);
  // unteres Rohr
  ctx.fillRect(px - hw, yGapBot, hw * 2, yGround - yGapBot);
  // Lippen (klassischer Flappy-Rand)
  const lipW = hw * 1.18, lipH = Math.max(0.7 * s, 3);
  ctx.fillRect(px - lipW, yGapTop - lipH, lipW * 2, lipH);
  ctx.fillRect(px - lipW, yGapBot, lipW * 2, lipH);
  ctx.strokeStyle = rim; ctx.lineWidth = Math.max(1, s * 0.06);
  ctx.strokeRect(px - lipW, yGapTop - lipH, lipW * 2, lipH);
  ctx.strokeRect(px - lipW, yGapBot, lipW * 2, lipH);
  // elliptische Kappen → Zylinder-Look
  const ry = hw * 0.22;
  ctx.fillStyle = rim;
  ctx.beginPath(); ctx.ellipse(px, yGapTop, lipW, ry, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = bodyD;
  ctx.beginPath(); ctx.ellipse(px, yGapTop, lipW * 0.82, ry * 0.7, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = mixRGB([160, 235, 150], sky.fog, t);
  ctx.beginPath(); ctx.ellipse(px, yGapBot, lipW, ry, 0, Math.PI, 0, true); ctx.fill();

  const wingLift = flapUp * H * 0.24 + Math.sin(time * 2.2) * H * 0.012;
  for (const side of [-1, 1]) {
    const rootX = W / 2 + side * W * 0.18;
    const tipX = W / 2 + side * W * 0.62;
    const tipY = baseY - wingLift - H * 0.04;
    ctx.fillStyle = '#f6c343';
    ctx.beginPath();
    ctx.moveTo(rootX, baseY + H * 0.08);
    ctx.quadraticCurveTo(W / 2 + side * W * 0.42, baseY - wingLift * 0.7, tipX, tipY);
    ctx.quadraticCurveTo(W / 2 + side * W * 0.5, baseY + H * 0.09 - wingLift * 0.3, rootX, baseY + H * 0.16);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#e09a20';
    ctx.beginPath();
    ctx.moveTo(W / 2 + side * W * 0.34, baseY + H * 0.02 - wingLift * 0.55);
    ctx.quadraticCurveTo(W / 2 + side * W * 0.5, baseY - wingLift * 0.75, tipX, tipY);
    ctx.quadraticCurveTo(W / 2 + side * W * 0.52, baseY + H * 0.05 - wingLift * 0.4, W / 2 + side * W * 0.34, baseY + H * 0.06 - wingLift * 0.5);
    ctx.closePath(); ctx.fill();
  }
  // Schnabel unten in der Mitte
  ctx.fillStyle = '#ff8c1a';
  ctx.beginPath();
  ctx.moveTo(W / 2 - W * 0.05, H + 2);
  ctx.lineTo(W / 2, baseY + H * 0.035);
  ctx.lineTo(W / 2 + W * 0.05, H + 2);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#d96f0a';
  ctx.beginPath();
  ctx.moveTo(W / 2 - W * 0.028, H + 2);
  ctx.lineTo(W / 2, baseY + H * 0.055);

/* ============================================================
   2D-RENDERER — Klassische Seitenansicht mit Parallaxe
   ============================================================ */
function render2D() {
  const sky = skyColors();
  const groundH = Math.max(H * 0.11, 56);
  const playH = H - groundH;
  const yScale = playH / (WORLD_TOP + 1.5);
  const xScale = Math.max(W / 26, 13);
  const birdSX = W * 0.3;
  const wy2sy = (wy) => playH - wy * yScale;
  const shk = shake ? (Math.random() - 0.5) * shake * 16 : 0;
  ctx.save(); ctx.translate(shk, shk * 0.6);

  // Himmel
  const g = ctx.createLinearGradient(0, 0, 0, playH);
  g.addColorStop(0, mixRGB(sky.top, sky.top, 0)); g.addColorStop(1, mixRGB(sky.bot, sky.bot, 0));
  ctx.fillStyle = g; ctx.fillRect(-20, -20, W + 40, playH + 40);

  // Sonne
  const sunX = W * 0.78, sunY = H * 0.15;
  const sg = ctx.createRadialGradient(sunX, sunY, 4, sunX, sunY, H * 0.16);
  sg.addColorStop(0, 'rgba(255,250,200,0.95)'); sg.addColorStop(1, 'rgba(255,240,170,0)');
  ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(sunX, sunY, H * 0.16, 0, TAU); ctx.fill();
  ctx.fillStyle = '#fffbe0'; ctx.beginPath(); ctx.arc(sunX, sunY, H * 0.04, 0, TAU); ctx.fill();

  const scroll = dist * xScale;
  // Wolken (Parallaxe 0.15)
  for (let i = 0; i < 7; i++) {
    const cw = W + 260;
    const x = (hash(i * 12.3) * cw - scroll * 0.15 - time * 6) % cw;
    const xx = (x + cw) % cw - 130;
    const y = 30 + hash(i * 7.1) * playH * 0.32;
    const r = 22 + hash(i * 3.7) * 26;
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath();
    ctx.arc(xx, y, r * 0.55, 0, TAU); ctx.arc(xx - r * 0.6, y + r * 0.15, r * 0.4, 0, TAU);
    ctx.arc(xx + r * 0.6, y + r * 0.12, r * 0.45, 0, TAU); ctx.arc(xx + r * 0.1, y - r * 0.22, r * 0.38, 0, TAU);
    ctx.fill();
  }
  // Heissluftballon (Parallaxe 0.2)
  {
    const cw = W + 400;
    const x = ((W * 0.6 - scroll * 0.2) % cw + cw) % cw - 200;
    const y = playH * 0.22 + Math.sin(time * 0.5) * 12, r = 26;
    ctx.fillStyle = '#e5533d'; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffd93b'; ctx.beginPath(); ctx.ellipse(x - r * 0.35, y, r * 0.3, r * 0.95, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(60,40,20,0.7)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x - r * 0.4, y + r * 0.85); ctx.lineTo(x - r * 0.22, y + r * 1.5);
    ctx.moveTo(x + r * 0.4, y + r * 0.85); ctx.lineTo(x + r * 0.22, y + r * 1.5); ctx.stroke();
    ctx.fillStyle = '#8a5a2b'; ctx.fillRect(x - r * 0.28, y + r * 1.45, r * 0.56, r * 0.4);
  }
  // ferne Berge (0.1)
  drawHills2D(playH, scroll * 0.1, 0.004, playH * 0.2, mixRGB(mixRGB2([126, 152, 196], [200, 120, 150], sky.evening), sky.fog, 0.4));
  // Stadt-Silhouette (0.22)
  drawCity2D(playH, scroll * 0.22, sky);
  // Hügel mit Bäumchen (0.4)
  drawHills2D(playH, scroll * 0.4, 0.008, playH * 0.1, mixRGB([104, 165, 110], sky.fog, 0.25), true);

  // Vogelschwarm
  for (let i = 0; i < 4; i++) {
    const cw = W + 200;
    const x = ((hash(i * 8.8) * cw - time * (26 + i * 6)) % cw + cw) % cw - 100;
    const y = 40 + hash(i * 5.5) * playH * 0.25 + Math.sin(time * 3 + i) * 5;
    const w = Math.sin(time * 9 + i * 2) * 4;
    ctx.strokeStyle = 'rgba(40,40,60,0.7)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x - 7, y - w); ctx.quadraticCurveTo(x, y + 3, x + 7, y - w); ctx.stroke();

  // Röhren
  for (const p of pipes) {
    const sx = birdSX + (p.z - bird.z) * xScale;
    const pw = PIPE_R * 2 * xScale;
    if (sx < -pw || sx > W + pw) continue;
    drawPipe2D(sx, pw, wy2sy(p.gapY + p.gapH / 2), wy2sy(p.gapY - p.gapH / 2), playH);
  }

  // Partikel
  for (const pt of particles) {
    const sx = birdSX + (pt.z - bird.z) * xScale + pt.x * xScale;
    ctx.fillStyle = `rgba(255,255,255,${pt.life})`;
    ctx.beginPath(); ctx.arc(sx, wy2sy(pt.y), 3, 0, TAU); ctx.fill();

  gg.addColorStop(0, '#8ed970'); gg.addColorStop(0.25, '#6cbf4e'); gg.addColorStop(1, '#4f9c39');

  // Gras-Büschel & Blumen auf dem Boden (scrollen mit)
  for (let i = 0; i < Math.ceil(W / 26) + 2; i++) {
    const x = ((i * 26 - scroll) % (W + 52) + W + 52) % (W + 52) - 26;
    const v = hash(i * 3.3 + Math.floor(scroll / (W + 52)) * 0.01 + i);
    ctx.strokeStyle = 'rgba(30,100,30,0.6)'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x, playH + 14); ctx.lineTo(x - 3, playH + 6);
    ctx.moveTo(x, playH + 14); ctx.lineTo(x + 1, playH + 4);
    ctx.moveTo(x, playH + 14); ctx.lineTo(x + 4, playH + 7);
    ctx.stroke();
    if (v > 0.75) {
      const cols = ['#ff6b8a', '#ffd93b', '#b48aff', '#ff9c4a'];
      ctx.fillStyle = cols[Math.floor(v * 20) % cols.length];
      ctx.beginPath(); ctx.arc(x + 8, playH + 10, 3.2, 0, TAU); ctx.fill();
      ctx.fillStyle = '#fff3b0';
      ctx.beginPath(); ctx.arc(x + 8, playH + 10, 1.3, 0, TAU); ctx.fill();
    }
  }
  // Schmetterlinge
  for (let i = 0; i < 3; i++) {
    const cw = W + 120;
    const x = ((hash(i * 21.7) * cw - scroll * 0.7) % cw + cw) % cw - 60;
    const y = playH - 30 - hash(i * 17.3) * 60 + Math.sin(time * 2.5 + i * 2) * 14;
    const w = Math.abs(Math.sin(time * 12 + i));
    ctx.fillStyle = ['#ff8adf', '#8ad4ff', '#ffd93b'][i];
    ctx.beginPath();
    ctx.ellipse(x - 3, y, 4 * w + 0.5, 5, -0.5, 0, TAU);
    ctx.ellipse(x + 3, y, 4 * w + 0.5, 5, 0.5, 0, TAU); ctx.fill();
    ctx.fillStyle = '#4a3320'; ctx.fillRect(x - 0.8, y - 4, 1.6, 8);
  }
  ctx.restore();
  if (flash > 0) { ctx.fillStyle = `rgba(255,60,40,${flash * 0.35})`; ctx.fillRect(0, 0, W, H); }
}
function drawHills2D(playH, off, freq, amp, col, withTrees) {

    const n = hash(Math.floor((x + off) * freq * 300)) * 0.6 + hash(Math.floor((x + off) * freq * 700)) * 0.4;
    ctx.lineTo(x, playH + 2 - n * amp - amp * 0.2);
  }
  ctx.lineTo(W + 20, playH + 2); ctx.closePath(); ctx.fill();
  if (withTrees) {
    for (let i = 0; i < 8; i++) {
      const cw = W + 80;
      const x = ((hash(i * 6.6) * cw - off) % cw + cw) % cw - 40;
      const n = hash(Math.floor((x + off) * freq * 300)) * 0.6 + hash(Math.floor((x + off) * freq * 700)) * 0.4;
      const y = playH + 2 - n * amp - amp * 0.2;
      ctx.fillStyle = 'rgba(40,100,50,0.85)';

    }

  ctx.fillRect(sx - lipW / 2, gapBotY, lipW, lipH);
  ctx.strokeStyle = '#14501c'; ctx.lineWidth = 2;
  ctx.strokeRect(sx - lipW / 2, gapTopY - lipH, lipW, lipH);
  ctx.strokeRect(sx - lipW / 2, gapBotY, lipW, lipH);
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  ctx.fillRect(sx - pw * 0.28, -20, pw * 0.12, gapTopY + 20);
  ctx.fillRect(sx - pw * 0.28, gapBotY, pw * 0.12, playH - gapBotY + 4);
}
function drawBird2D(x, y, yScale) {
  const r = Math.max(BIRD_R * yScale, 12);
  const rot = clamp(-bird.vy * 0.06, -0.5, 1.1) * (state === 'dying' ? 2 : 1);
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = '#f6c343';
  ctx.beginPath(); ctx.ellipse(0, 0, r * 1.15, r, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#fde9b0';
  ctx.beginPath(); ctx.ellipse(r * 0.15, r * 0.35, r * 0.65, r * 0.45, 0, 0, TAU); ctx.fill();
  const wingA = Math.sin(flapAnim * Math.PI) * 0.9 + Math.sin(time * 6) * 0.12;
  ctx.save(); ctx.translate(-r * 0.2, 0); ctx.rotate(-wingA);
  ctx.fillStyle = '#e09a20';
  ctx.beginPath(); ctx.ellipse(-r * 0.35, 0, r * 0.7, r * 0.42, -0.3, 0, TAU); ctx.fill();
  ctx.restore();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(r * 0.45, -r * 0.3, r * 0.34, 0, TAU); ctx.fill();
  ctx.fillStyle = '#222';
  ctx.beginPath(); ctx.arc(r * 0.55, -r * 0.3, r * 0.16, 0, TAU); ctx.fill();
  ctx.fillStyle = '#ff8c1a';
  ctx.beginPath(); ctx.moveTo(r * 0.8, -r * 0.05); ctx.lineTo(r * 1.5, r * 0.12); ctx.lineTo(r * 0.8, r * 0.32); ctx.closePath(); ctx.fill();
  ctx.restore();
}

/* ---------- UI / Zustände ---------- */
const $ = id => document.getElementById(id);
function showLobby() {
  state = 'lobby';
  $('lobby').classList.remove('hidden');
  $('gameover').classList.add('hidden');
  $('hud').classList.add('hidden');
  $('tapHint').classList.add('hidden');
  $('bestLobby').textContent = best;
  resetGame();
  state = 'lobby';
}
function startGame() {
  resetGame();
  state = 'ready';
  $('lobby').classList.add('hidden');
  $('gameover').classList.add('hidden');
  $('hud').classList.remove('hidden');
  $('tapHint').classList.remove('hidden');
  $('score').textContent = '0';
}
function gameOver() {
  state = 'over';
  const isBest = score > best;
  if (isBest) { best = score; localStorage.setItem('flappyBest', best); }
  $('finalScore').textContent = score;
  $('finalBest').textContent = best;
  $('medal').textContent = score >= 30 ? '🏆' : score >= 20 ? '🥇' : score >= 10 ? '🥈' : '🥉';
  $('newBestTag').classList.toggle('hidden', !isBest);
  $('gameover').classList.remove('hidden');
  $('hud').classList.add('hidden');
}
function setMode(m) {
  mode = m; localStorage.setItem('flappyMode', m);
  $('btn3d').classList.toggle('active', m === '3d');
  $('btn2d').classList.toggle('active', m === '2d');
}
$('btn3d').addEventListener('click', () => setMode('3d'));
$('btn2d').addEventListener('click', () => setMode('2d'));
$('btnStart').addEventListener('click', (e) => { e.stopPropagation(); startGame(); });
$('btnRetry').addEventListener('click', (e) => { e.stopPropagation(); startGame(); });
$('btnLobby').addEventListener('click', (e) => { e.stopPropagation(); showLobby(); });
$('btnSound').addEventListener('click', (e) => {
  e.stopPropagation();
  soundOn = !soundOn;
  localStorage.setItem('flappySound', soundOn ? '1' : '0');
  $('btnSound').textContent = soundOn ? '🔊' : '🔇';
});
$('btnSound').textContent = soundOn ? '🔊' : '🔇';

function inputDown(e) {
  if (state === 'ready' || state === 'play') { e.preventDefault(); flap(); }
}
window.addEventListener('pointerdown', inputDown, { passive: false });
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    if (state === 'ready' || state === 'play') flap();
    else if (state === 'over') startGame();
    else if (state === 'lobby') startGame();
  }
});

/* ---------- Hauptschleife ---------- */
let lastT = performance.now();
function frame(now) {
  const dt = Math.min((now - lastT) / 1000, 1 / 30);
  lastT = now;
  update(dt);
  if (mode === '3d') render3D(); else render2D();
  requestAnimationFrame(frame);
}
$('bestLobby').textContent = best;
resetGame();
state = 'lobby';
requestAnimationFrame(frame);
</script>
