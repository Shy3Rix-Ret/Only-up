<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0e1220">
<title>VoxScribe – Transkription DE/EN</title>
<style>
  :root{
    --bg:#0e1220; --bg2:#151b30; --card:#1a2138; --line:#2a3350;
    --txt:#e9edf7; --dim:#95a0c0; --accent:#6c8cff; --accent2:#39d6a5;
    --warn:#ffb648; --bad:#ff6b6b; --radius:16px;
  }
  [data-theme="light"]{
    --bg:#f2f4fa; --bg2:#ffffff; --card:#ffffff; --line:#dde3f0;
    --txt:#141a2b; --dim:#5d6785; --accent:#3f5fe0; --accent2:#18a37a;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--bg);color:var(--txt);
       font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
       display:flex;flex-direction:column;overscroll-behavior:none}
  button,select,input,textarea{font-family:inherit;color:inherit}
  .btn{background:var(--card);border:1px solid var(--line);color:var(--txt);
       border-radius:12px;padding:9px 13px;font-size:14px;font-weight:600;cursor:pointer;
       display:inline-flex;align-items:center;gap:7px;transition:.15s;white-space:nowrap}
  .btn:hover{border-color:var(--accent);transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.ghost{background:transparent}
  .btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
  .btn.danger:hover{border-color:var(--bad);color:var(--bad)}

  header{display:flex;align-items:center;gap:10px;padding:10px 14px;
         padding-top:calc(10px + env(safe-area-inset-top));
         background:var(--bg2);border-bottom:1px solid var(--line);flex-wrap:wrap}
  .logo{font-weight:900;font-size:19px;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
  .logo span{background:linear-gradient(90deg,var(--accent),var(--accent2));
             -webkit-background-clip:text;background-clip:text;color:transparent}
  .spacer{flex:1}

  .langbar{display:flex;gap:6px;padding:10px 14px 0;flex-wrap:wrap;align-items:center}
  .lang{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);
        font-weight:700;font-size:14px;cursor:pointer;transition:.15s}
  .lang.active{background:var(--accent);border-color:var(--accent);color:#fff;
               box-shadow:0 4px 14px rgba(108,140,255,.35)}
  .hint{font-size:12px;color:var(--dim);padding:6px 14px 0;line-height:1.45}

  main{flex:1;display:flex;flex-direction:column;min-height:0;padding:0 14px 12px}
  #transcript{flex:1;min-height:0;overflow-y:auto;background:var(--card);border:1px solid var(--line);
              border-radius:var(--radius);padding:16px;margin-top:10px;font-size:18px;line-height:1.65;
              scroll-behavior:smooth}
  #transcript.big{font-size:23px}
  .seg{margin-bottom:10px;display:flex;gap:10px;align-items:flex-start}
  .ts{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;padding-top:6px;
      min-width:52px;user-select:none}
  .ts.hide{display:none}
  .txt{flex:1;outline:none;border-radius:8px;padding:2px 4px}
  .txt:focus{background:rgba(108,140,255,.12);box-shadow:0 0 0 2px var(--accent)}
  .tag{font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;margin-right:6px;
       vertical-align:middle;letter-spacing:.5px}
  .tag.de{background:rgba(255,182,72,.2);color:var(--warn)}
  .tag.en{background:rgba(57,214,165,.2);color:var(--accent2)}
  .tag.hide{display:none}
  .lowconf{border-bottom:2px dotted var(--warn)}
  .filler{background:rgba(255,107,107,.18);border-radius:4px}
  mark{background:var(--warn);color:#241a00;border-radius:3px}
  #interim{color:var(--dim);font-style:italic;opacity:.9;min-height:1.6em}
  .empty{color:var(--dim);text-align:center;padding:40px 10px;line-height:1.7}

  .dock{display:flex;align-items:center;gap:12px;padding:10px 0 0}
  .micwrap{position:relative;width:64px;height:64px;flex:none}
  #mic{width:64px;height:64px;border-radius:50%;border:none;cursor:pointer;font-size:26px;
       background:linear-gradient(145deg,var(--accent),#4a6ae0);color:#fff;
       box-shadow:0 6px 18px rgba(108,140,255,.4);transition:.15s;position:relative;z-index:2}
  #mic.rec{background:linear-gradient(145deg,#ff6b6b,#d94141);box-shadow:0 6px 18px rgba(255,107,107,.45)}
  #mic:active{transform:scale(.94)}
  .pulse{position:absolute;inset:0;border-radius:50%;background:#ff6b6b;opacity:0;z-index:1}
  #mic.rec ~ .pulse{animation:pulse 1.6s ease-out infinite}
  @keyframes pulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.9);opacity:0}}
  #wave{flex:1;height:56px;background:var(--card);border:1px solid var(--line);border-radius:14px}
  .stat{font-size:12px;color:var(--dim);text-align:right;line-height:1.5;min-width:96px;
        font-variant-numeric:tabular-nums}
  .stat b{color:var(--txt);font-size:15px;display:block}

  .toolrow{display:flex;gap:7px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
  .toolrow::-webkit-scrollbar{display:none}

  .panel{position:fixed;inset:auto 0 0 0;max-height:82vh;overflow-y:auto;background:var(--bg2);
         border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding:18px 16px;
         padding-bottom:calc(24px + env(safe-area-inset-bottom));
         box-shadow:0 -12px 40px rgba(0,0,0,.4);z-index:50;transform:translateY(100%);
         transition:transform .25s cubic-bezier(.3,.8,.3,1)}
  .panel.open{transform:translateY(0)}
  .panel h3{font-size:17px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;
       border-bottom:1px solid var(--line);font-size:14px}
  .row:last-child{border-bottom:none}
  .row small{display:block;color:var(--dim);font-size:12px;margin-top:3px;font-weight:400;line-height:1.4}
  .row label{font-weight:600;flex:1}
  .sw{width:46px;height:26px;border-radius:99px;background:var(--line);position:relative;flex:none;
      cursor:pointer;transition:.2s;border:none}
  .sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
             background:#fff;transition:.2s}
  .sw.on{background:var(--accent2)}
  .sw.on::after{transform:translateX(20px)}
  input[type=text],input[type=search],textarea,select{
      background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;
      font-size:14px;width:100%}
  textarea{resize:vertical;min-height:90px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.5}
  .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;opacity:0;pointer-events:none;
            transition:.25s}
  .backdrop.open{opacity:1;pointer-events:auto}
  .close{position:absolute;top:14px;right:14px}

  .searchbar{display:none;gap:7px;padding-top:10px;align-items:center}
  .searchbar.open{display:flex}
  .sess{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
  .sess .nm{flex:1;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sess .mt{font-size:11px;color:var(--dim)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--card);
         border:1px solid var(--line);border-radius:12px;padding:11px 18px;font-size:14px;font-weight:600;
         z-index:99;opacity:0;pointer-events:none;transition:.25s;box-shadow:0 8px 26px rgba(0,0,0,.4);
         max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast.err{border-color:var(--bad);color:var(--bad)}
  .kbd{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
  @media(max-width:560px){
    .stat{min-width:74px;font-size:11px}
    #wave{height:48px}
    .logo{font-size:16px}
  }
</style>
</head>
<body>

<header>
  <div class="logo">🎙️ <span>VoxScribe</span></div>
  <div class="spacer"></div>
  <button class="btn sm ghost" id="btnSearch" title="Suchen">🔍</button>
  <button class="btn sm ghost" id="btnTheme" title="Design wechseln">🌙</button>
  <button class="btn sm ghost" id="btnSessions" title="Gespeicherte Sitzungen">📁</button>
  <button class="btn sm ghost" id="btnSettings" title="Einstellungen">⚙️</button>
</header>

<div class="langbar">
  <button class="lang active" data-mode="de">🇩🇪 Deutsch</button>
  <button class="lang" data-mode="en">🇬🇧 English</button>
  <button class="lang" data-mode="mix">🔀 Gemischt DE+EN</button>
  <span class="hint" id="modeHint"></span>
</div>

<div style="padding:0 14px">
  <div class="searchbar" id="searchbar">
    <input type="search" id="q" placeholder="Im Transkript suchen…">
    <button class="btn sm" id="btnSearchClose">✕</button>
  </div>
</div>

<main>
  <div id="transcript">
    <div class="empty" id="empty">
      Drücke das Mikrofon und sprich einfach los.<br>
      Alles wird live transkribiert – auf Deutsch, Englisch oder gemischt.<br>
      <span class="kbd">Strg</span> + <span class="kbd">M</span> startet/stoppt auch.
    </div>
    <div id="segments"></div>
    <div id="interim"></div>
  </div>

  <div class="dock">
    <div class="micwrap">
      <button id="mic" title="Aufnahme starten (Strg+M)">🎤</button>
      <div class="pulse"></div>
    </div>
    <canvas id="wave"></canvas>
    <div class="stat">
      <b id="stWords">0</b>Wörter
      <b id="stTime" style="margin-top:4px">0:00</b>Dauer
    </div>
  </div>

  <div class="toolrow">
    <button class="btn sm" id="btnCopy">📋 Kopieren</button>
    <button class="btn sm" id="btnTxt">⬇️ TXT</button>
    <button class="btn sm" id="btnMd">⬇️ Markdown</button>
    <button class="btn sm" id="btnSrt">⬇️ SRT</button>
    <button class="btn sm" id="btnAudio" title="Aufgenommenes Audio herunterladen" disabled>🔊 Audio</button>
    <button class="btn sm" id="btnSpeak">🔈 Vorlesen</button>
    <button class="btn sm" id="btnSave">💾 Sitzung sichern</button>
    <button class="btn sm" id="btnStats">📊 Statistik</button>
    <button class="btn sm danger" id="btnClear">🗑️ Leeren</button>
  </div>
</main>

<div class="backdrop" id="backdrop"></div>

<!-- Einstellungen -->
<div class="panel" id="pSettings">
  <button class="btn sm ghost close" data-close>✕</button>
  <h3>⚙️ Einstellungen</h3>

  <div class="row"><label>Dauerbetrieb<small>Startet nach Pausen automatisch neu – für lange Diktate.</small></label>
    <button class="sw on" data-opt="continuous"></button></div>
  <div class="row"><label>Auto-Interpunktion<small>Groß-/Kleinschreibung und Satzpunkte automatisch setzen.</small></label>
    <button class="sw on" data-opt="autoPunct"></button></div>
  <div class="row"><label>Sprachbefehle<small>„Punkt“, „Komma“, „neue Zeile“, „neuer Absatz“, „period“, „new line“ …</small></label>
    <button class="sw on" data-opt="commands"></button></div>
  <div class="row"><label>Füllwörter markieren<small>äh, ähm, quasi, uh, um, like … werden hervorgehoben.</small></label>
    <button class="sw on" data-opt="markFillers"></button></div>
  <div class="row"><label>Füllwörter entfernen<small>Löscht sie direkt beim Transkribieren.</small></label>
    <button class="sw" data-opt="dropFillers"></button></div>
  <div class="row"><label>Zeitstempel anzeigen</label>
    <button class="sw on" data-opt="showTs"></button></div>
  <div class="row"><label>Sprach-Label anzeigen<small>Zeigt bei gemischtem Modus DE/EN pro Abschnitt.</small></label>
    <button class="sw on" data-opt="showLang"></button></div>
  <div class="row"><label>Unsichere Stellen unterstreichen<small>Niedrige Erkennungssicherheit wird gepunktet markiert.</small></label>
    <button class="sw on" data-opt="markLow"></button></div>
  <div class="row"><label>Audio mitschneiden<small>Nimmt parallel eine Audiodatei auf (Download über 🔊 Audio).</small></label>
    <button class="sw" data-opt="recordAudio"></button></div>
  <div class="row"><label>Bildschirm wachhalten<small>Verhindert das Abdunkeln während der Aufnahme.</small></label>
    <button class="sw on" data-opt="wakeLock"></button></div>
  <div class="row"><label>Große Schrift</label>
    <button class="sw" data-opt="bigText"></button></div>
  <div class="row"><label>Automatisch sichern<small>Transkript bleibt nach dem Neuladen erhalten.</small></label>
    <button class="sw on" data-opt="autosave"></button></div>

  <div class="row" style="display:block">
    <label>Sprachen im gemischten Modus</label>
    <div style="display:flex;gap:8px;margin-top:8px">
      <select id="langA"></select>
      <select id="langB"></select>
    </div>
  </div>
  <div class="row" style="display:block">
    <label>Bevorzugte Sprache im Zweifel<small>Bei ähnlicher Erkennungssicherheit gewinnt diese Sprache.</small></label>
    <div style="display:flex;gap:8px;margin-top:8px;align-items:center">
      <input type="range" id="bias" min="0" max="100" value="55" style="flex:1">
      <span id="biasVal" style="font-size:13px;color:var(--dim);min-width:74px;text-align:right"></span>
    </div>
  </div>

  <div class="row" style="display:block">
    <label>Eigenes Wörterbuch<small>Eine Ersetzung pro Zeile: <code>falsch = richtig</code>. Ideal für Namen und Fachbegriffe.</small></label>
    <textarea id="dict" placeholder="klaus schmit = Klaus Schmidt&#10;kubernetis = Kubernetes&#10;jason = JSON"></textarea>
    <button class="btn sm" id="btnDictSave" style="margin-top:8px">Wörterbuch speichern</button>
  </div>
</div>

<!-- Sitzungen -->
<div class="panel" id="pSessions">
  <button class="btn sm ghost close" data-close>✕</button>
  <h3>📁 Gespeicherte Sitzungen</h3>
  <div id="sessList"></div>
</div>

<!-- Statistik -->
<div class="panel" id="pStats">
  <button class="btn sm ghost close" data-close>✕</button>
  <h3>📊 Statistik</h3>
  <div id="statsBody"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ─────────── Einstellungen ─────────── */
const DEF = {continuous:true,autoPunct:true,commands:true,markFillers:true,dropFillers:false,
             showTs:true,showLang:true,markLow:true,recordAudio:false,wakeLock:true,
             bigText:false,autosave:true,theme:'dark',langA:'de-DE',langB:'en-US',bias:55};
let opt = Object.assign({}, DEF, JSON.parse(localStorage.getItem('vox.opt')||'{}'));
const saveOpt = () => localStorage.setItem('vox.opt', JSON.stringify(opt));

const LANGS = [['de-DE','Deutsch (DE)'],['de-AT','Deutsch (AT)'],['de-CH','Deutsch (CH)'],
               ['en-US','English (US)'],['en-GB','English (UK)'],['en-AU','English (AU)'],
               ['fr-FR','Français'],['es-ES','Español'],['it-IT','Italiano'],
               ['tr-TR','Türkçe'],['nl-NL','Nederlands'],['pl-PL','Polski'],['pt-PT','Português']];

/* ─────────── Zustand ─────────── */
let segments = [];          // {id,text,lang,conf,t0,t1}
let mode = localStorage.getItem('vox.mode') || 'de';
let listening = false, engines = [], startTime = 0, elapsedBase = 0, timerId = null;
let pending = null, segId = 1;
let audioCtx, analyser, micStream, rafId, recorder, chunks = [], audioURL = null, wakeLockRef = null;

const $ = s => document.querySelector(s);
const segBox = $('#segments'), interimEl = $('#interim'), transcript = $('#transcript');

/* ─────────── Hilfsfunktionen ─────────── */
function toast(msg, err){
  const t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (err?' err':'');
  clearTimeout(t._h); t._h = setTimeout(()=>t.className='toast', 2600);
}
const fmt = s => { s=Math.max(0,Math.floor(s)); const m=Math.floor(s/60);
  return (m>=60? Math.floor(m/60)+':'+String(m%60).padStart(2,'0') : m)+':'+String(s%60).padStart(2,'0'); };
const srtTime = ms => { const h=Math.floor(ms/3.6e6), m=Math.floor(ms/6e4)%60, s=Math.floor(ms/1e3)%60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')},${String(Math.floor(ms)%1000).padStart(3,'0')}`; };
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function download(name, text, type='text/plain'){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: type+';charset=utf-8'}));
  a.download = name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}

/* ─────────── Textverarbeitung ─────────── */
const CMDS = [
  [/\b(neuer absatz|new paragraph)\b/gi, '\n\n'],
  [/\b(neue zeile|zeilenumbruch|new line|newline)\b/gi, '\n'],
  [/\b(punkt|full stop|period)\b/gi, '.'],
  [/\b(komma|comma)\b/gi, ','],
  [/\b(fragezeichen|question mark)\b/gi, '?'],
  [/\b(ausrufezeichen|exclamation mark|exclamation point)\b/gi, '!'],
  [/\b(doppelpunkt|colon)\b/gi, ':'],
  [/\b(semikolon|semicolon)\b/gi, ';'],
  [/\b(bindestrich|hyphen|dash)\b/gi, '-'],
  [/\b(gedankenstrich)\b/gi, ' – '],
];
// Lookarounds statt \b: \b ist ASCII-basiert und würde bei „äh“/„öhm“ versagen.
const FILLERS = /(?<![\p{L}\p{N}])(äh+m?|öh+m?|ähem|hmm+|halt|quasi|sozusagen|irgendwie|uh+|um+|erm|like|you know|i mean|basically|literally)(?![\p{L}\p{N}])/giu;

function applyCommands(t){
  if(!opt.commands) return t;
  CMDS.forEach(([re, rep]) => t = t.replace(re, rep));
  return t.replace(/[^\S\n]+([.,!?;:])/g, '$1')      // Leerzeichen vor Satzzeichen weg
          .replace(/([.,!?;:])(?=[^\s\d])/g, '$1 ')   // Leerzeichen danach
          .replace(/[^\S\n]*\n[^\S\n]*/g, '\n');      // saubere Zeilenumbrüche
}
function applyDict(t){
  const rules = (localStorage.getItem('vox.dict')||'').split('\n')
      .map(l => l.split('=')).filter(p => p.length===2 && p[0].trim());
  rules.forEach(([from, to]) => {
    const f = from.trim().replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    t = t.replace(new RegExp(`(?<![\\p{L}])${f}(?![\\p{L}])`,'giu'), to.trim());
  });
  return t;
}
function autoPunct(t){
  if(!opt.autoPunct) return t;
  return t.replace(/(^|[.!?]\s+|\n\s*)([a-zäöüß])/g, (m,a,b) => a + b.toUpperCase());
}
function cleanFillers(t){
  return opt.dropFillers
    ? t.replace(FILLERS,'').replace(/[^\S\n]{2,}/g,' ').replace(/[^\S\n]+([.,!?;:])/g,'$1').trim()
    : t;
}

function processFinal(raw){
  let t = raw.trim();
  if(!t) return '';
  t = applyCommands(t);
  t = applyDict(t);
  t = cleanFillers(t);
  t = autoPunct(t);
  return t.trim();
}

/* ─────────── Rendering ─────────── */
function segHTML(s){
  let html = esc(s.text).replace(/\n/g,'<br>');
  if(opt.markFillers && !opt.dropFillers)
    html = html.replace(FILLERS, m => `<span class="filler">${m}</span>`);
  const q = $('#q').value.trim();
  if(q){
    const re = new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
    html = html.replace(re, '<mark>$1</mark>');
  }
  const low = opt.markLow && s.conf > 0 && s.conf < 0.72;
  const tag = mode==='mix' ? `<span class="tag ${s.lang.startsWith('de')?'de':'en'} ${opt.showLang?'':'hide'}">${s.lang.slice(0,2).toUpperCase()}</span>` : '';
  return `<span class="ts ${opt.showTs?'':'hide'}">${fmt(s.t0/1000)}</span>
          <span class="txt ${low?'lowconf':''}" contenteditable="true" data-id="${s.id}">${tag}${html}</span>`;
}
function renderAll(){
  segBox.innerHTML = '';
  segments.forEach(s => {
    const d = document.createElement('div');
    d.className = 'seg'; d.dataset.id = s.id; d.innerHTML = segHTML(s);
    segBox.appendChild(d);
  });
  $('#empty').style.display = segments.length ? 'none' : '';
  updateStats();
}
function appendSeg(s){
  const d = document.createElement('div');
  d.className = 'seg'; d.dataset.id = s.id; d.innerHTML = segHTML(s);
  segBox.appendChild(d);
  $('#empty').style.display = 'none';
  transcript.scrollTop = transcript.scrollHeight;
  updateStats();
}
segBox.addEventListener('input', e => {
  const el = e.target.closest('.txt'); if(!el) return;
  const s = segments.find(x => x.id == el.dataset.id);
  if(s){ s.text = el.innerText.replace(/^(DE|EN)\s*/,''); updateStats(); persist(); }
});

function plainText(){ return segments.map(s => s.text).join('\n'); }

/* ─────────── Statistik ─────────── */
function elapsed(){ return elapsedBase + (listening ? Date.now()-startTime : 0); }
function words(t){ return (t.match(/[\p{L}\p{N}'’-]+/gu)||[]).length; }
function updateStats(){
  const t = plainText();
  $('#stWords').textContent = words(t);
  $('#stTime').textContent = fmt(elapsed()/1000);
}
function showStats(){
  const t = plainText(), w = words(t), secs = elapsed()/1000;
  const fills = (t.match(FILLERS)||[]);
  const tally = {}; fills.forEach(f => { const k=f.toLowerCase(); tally[k]=(tally[k]||0)+1; });
  const top = Object.entries(tally).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const sents = (t.match(/[^.!?]+[.!?]+/g)||[]).length || (w?1:0);
  const de = segments.filter(s=>s.lang.startsWith('de')).length, en = segments.length-de;
  const rows = [
    ['Wörter', w], ['Zeichen', t.length], ['Sätze', sents],
    ['Sprechdauer', fmt(secs)],
    ['Tempo', secs>2 ? Math.round(w/(secs/60))+' Wörter/Min' : '–'],
    ['Ø Satzlänge', sents ? Math.round(w/sents)+' Wörter' : '–'],
    ['Füllwörter', fills.length + (w? ` (${(fills.length/Math.max(w,1)*100).toFixed(1)} %)` : '')],
    ['Abschnitte', segments.length],
    ['Lesezeit', Math.max(1, Math.round(w/200))+' Min'],
  ];
  if(mode==='mix') rows.push(['Sprachverteilung', `${de}× DE · ${en}× EN`]);
  $('#statsBody').innerHTML = rows.map(([k,v]) =>
    `<div class="row"><label>${k}</label><b>${v}</b></div>`).join('') +
    (top.length ? `<div class="row" style="display:block"><label>Häufigste Füllwörter</label>
      <div style="margin-top:8px;font-size:13px;color:var(--dim)">${top.map(([k,v])=>`${k} × ${v}`).join(' · ')}</div></div>` : '');
  openPanel('#pStats');
}

/* ─────────── Spracherkennung ─────────── */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function activeLangs(){
  if(mode === 'de') return [opt.langA.startsWith('de') ? opt.langA : 'de-DE'];
  if(mode === 'en') return [opt.langB.startsWith('en') ? opt.langB : 'en-US'];
  return [opt.langA, opt.langB];
}
function makeEngine(lang){
  const r = new SR();
  r.lang = lang; r.continuous = true; r.interimResults = true; r.maxAlternatives = 3;
  r.onresult = e => {
    let interim = '';
    for(let i = e.resultIndex; i < e.results.length; i++){
      const res = e.results[i], alt = res[0];
      if(res.isFinal) handleFinal(lang, alt.transcript, alt.confidence ?? 0);
      else interim += alt.transcript;
    }
    if(interim.trim()) showInterim(lang, interim);
  };
  r.onerror = e => {
    if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){
      toast('Mikrofon-Zugriff verweigert. Bitte in den Browser-Einstellungen erlauben.', true);
      stop();
    } else if(e.error === 'network'){
      toast('Netzwerkfehler – die Spracherkennung braucht eine Internetverbindung.', true);
    } else if(e.error === 'audio-capture'){
      toast('Kein Mikrofon gefunden.', true); stop();
    }
  };
  r._stopped = false;
  r.onend = () => {
    if(listening && opt.continuous && !r._stopped){
      try{ r.start(); }catch(_){ setTimeout(()=>{ try{ listening && r.start(); }catch(_){} }, 400); }
    } else if(listening && !opt.continuous){
      stop();
    }
  };
  return r;
}

const interimBuf = {};
function showInterim(lang, text){
  interimBuf[lang] = text;
  const langs = activeLangs();
  const pick = mode==='mix'
      ? (interimBuf[langs[0]]?.length >= (interimBuf[langs[1]]?.length||0) ? langs[0] : langs[1])
      : lang;
  interimEl.textContent = interimBuf[pick] || '';
  transcript.scrollTop = transcript.scrollHeight;
}

function handleFinal(lang, text, conf){
  const t0 = pending ? pending.t0 : Math.max(0, elapsed() - Math.min(8000, text.length*70));
  if(mode !== 'mix'){ commit(text, lang, conf, t0); return; }

  // Zwei Engines laufen parallel: das sicherere Ergebnis gewinnt.
  const langs = activeLangs();
  const biasA = opt.bias/100 * 0.6 + 0.7;            // 0.7 … 1.3
  const score = (conf || 0.5) * (lang === langs[0] ? biasA : (2 - biasA));
  if(pending && pending.lang !== lang){
    clearTimeout(pending.timer);
    const win = score > pending.score ? {text, lang, conf} : pending;
    const t = pending.t0; pending = null;
    commit(win.text, win.lang, win.conf, t);
  } else {
    if(pending){ clearTimeout(pending.timer); const p = pending; pending = null; commit(p.text,p.lang,p.conf,p.t0); }
    pending = {text, lang, conf, score, t0, timer: setTimeout(() => {
      const p = pending; pending = null; if(p) commit(p.text, p.lang, p.conf, p.t0);
    }, 900)};
  }
}

function commit(raw, lang, conf, t0){
  let text = processFinal(raw);
  interimBuf[lang] = ''; interimEl.textContent = '';
  if(!text) return;
  // Satzzeichen am Anfang (z. B. gesprochenes „Punkt“) gehören ans Ende des vorigen Abschnitts.
  const lead = text.match(/^[.,!?;:]+/);
  if(lead && segments.length){
    const prev = segments[segments.length-1];
    prev.text = prev.text.replace(/[.,!?;:]*$/, '') + lead[0];
    const el = segBox.querySelector(`.seg[data-id="${prev.id}"]`);
    if(el) el.innerHTML = segHTML(prev);
    text = autoPunct(text.slice(lead[0].length).trim());
    if(!text) { persist(); return; }
  }
  const s = {id: segId++, text, lang, conf: conf||0, t0: t0 ?? elapsed(), t1: elapsed()};
  segments.push(s); appendSeg(s); persist();
}

/* ─────────── Start / Stop ─────────── */
async function start(){
  if(!SR){ toast('Dein Browser unterstützt keine Spracherkennung. Nutze Chrome, Edge oder Safari.', true); return; }
  listening = true; startTime = Date.now();
  $('#mic').classList.add('rec'); $('#mic').textContent = '⏹';
  timerId = setInterval(updateStats, 500);

  activeLangs().forEach((l, i) => {
    const e = makeEngine(l);
    engines.push(e);
    setTimeout(() => { try{ e.start(); }catch(err){
      if(i > 0) toast('Zweite Sprach-Engine konnte nicht starten – gemischter Modus läuft eingeschränkt.', true);
    }}, i * 250);
  });

  await initAudio();
  if(opt.wakeLock && 'wakeLock' in navigator){
    try{ wakeLockRef = await navigator.wakeLock.request('screen'); }catch(_){}
  }
}
function stop(){
  listening = false;
  elapsedBase += Date.now() - startTime;
  clearInterval(timerId); timerId = null;
  engines.forEach(e => { e._stopped = true; try{ e.stop(); }catch(_){} });
  engines = [];
  if(pending){ clearTimeout(pending.timer); const p = pending; pending = null; commit(p.text,p.lang,p.conf,p.t0); }
  interimEl.textContent = '';
  $('#mic').classList.remove('rec'); $('#mic').textContent = '🎤';
  stopAudio();
  if(wakeLockRef){ wakeLockRef.release().catch(()=>{}); wakeLockRef = null; }
  updateStats(); persist();
}
$('#mic').onclick = () => listening ? stop() : start();

/* ─────────── Audio: Pegel, Wellenform, Mitschnitt ─────────── */
async function initAudio(){
  try{
    micStream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true, autoGainControl:true}});
  }catch(_){ return; }
  audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser(); analyser.fftSize = 1024; analyser.smoothingTimeConstant = .75;
  audioCtx.createMediaStreamSource(micStream).connect(analyser);
  drawWave();
  if(opt.recordAudio && window.MediaRecorder){
    chunks = [];
    try{
      recorder = new MediaRecorder(micStream);
      recorder.ondataavailable = ev => ev.data.size && chunks.push(ev.data);
      recorder.onstop = () => {
        if(!chunks.length) return;
        if(audioURL) URL.revokeObjectURL(audioURL);
        audioURL = URL.createObjectURL(new Blob(chunks, {type: recorder.mimeType || 'audio/webm'}));
        $('#btnAudio').disabled = false;
      };
      recorder.start(1000);
    }catch(_){}
  }
}
function stopAudio(){
  if(recorder && recorder.state !== 'inactive'){ try{ recorder.stop(); }catch(_){} }
  recorder = null;
  cancelAnimationFrame(rafId); rafId = null;
  if(micStream){ micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  if(audioCtx){ audioCtx.close().catch(()=>{}); audioCtx = null; }
  const c = $('#wave'), x = c.getContext('2d'); x.clearRect(0,0,c.width,c.height);
}
function drawWave(){
  const c = $('#wave'), x = c.getContext('2d');
  const dpr = Math.min(2, devicePixelRatio||1);
  const buf = new Uint8Array(analyser.frequencyBinCount);
  const loop = () => {
    rafId = requestAnimationFrame(loop);
    const w = c.clientWidth, h = c.clientHeight;
    if(c.width !== w*dpr){ c.width = w*dpr; c.height = h*dpr; }
    x.setTransform(dpr,0,0,dpr,0,0);
    x.clearRect(0,0,w,h);
    analyser.getByteFrequencyData(buf);
    const bars = Math.min(64, Math.floor(w/6));
    const step = Math.floor(buf.length*0.6/bars);
    let peak = 0;
    for(let i=0;i<bars;i++){
      let v=0; for(let j=0;j<step;j++) v = Math.max(v, buf[i*step+j]);
      peak = Math.max(peak, v);
      const bh = Math.max(2, (v/255)*(h-10));
      const g = x.createLinearGradient(0,h/2-bh/2,0,h/2+bh/2);
      g.addColorStop(0,'#6c8cff'); g.addColorStop(1,'#39d6a5');
      x.fillStyle = g; x.globalAlpha = .35 + (v/255)*.65;
      const bw = w/bars;
      x.fillRect(i*bw+1, h/2-bh/2, bw-2, bh);
    }
    x.globalAlpha = 1;
    if(peak < 12){
      x.fillStyle = getComputedStyle(document.body).getPropertyValue('--dim');
      x.font = '12px system-ui'; x.textAlign = 'center';
      x.fillText('… zu leise? Sprich lauter oder näher ans Mikro', w/2, h/2+4);
    }
  };
  loop();
}

/* ─────────── Export ─────────── */
const stamp = () => new Date().toISOString().slice(0,16).replace('T','_').replace(':','-');
$('#btnCopy').onclick = async () => {
  const t = plainText(); if(!t) return toast('Nichts zu kopieren.');
  try{ await navigator.clipboard.writeText(t); toast('In die Zwischenablage kopiert ✓'); }
  catch(_){ toast('Kopieren nicht möglich.', true); }
};
$('#btnTxt').onclick = () => plainText() ? download(`transkript_${stamp()}.txt`, plainText()) : toast('Noch kein Text.');
$('#btnMd').onclick = () => {
  if(!segments.length) return toast('Noch kein Text.');
  const md = `# Transkript – ${new Date().toLocaleString('de-DE')}\n\n` +
    `*Dauer: ${fmt(elapsed()/1000)} · Wörter: ${words(plainText())} · Modus: ${mode.toUpperCase()}*\n\n` +
    segments.map(s => `**[${fmt(s.t0/1000)}]** ${s.text.replace(/\n/g,'  \n')}`).join('\n\n');
  download(`transkript_${stamp()}.md`, md, 'text/markdown');
};
$('#btnSrt').onclick = () => {
  if(!segments.length) return toast('Noch kein Text.');
  const srt = segments.map((s,i) =>
    `${i+1}\n${srtTime(s.t0)} --> ${srtTime(Math.max(s.t1, s.t0+1200))}\n${s.text.replace(/\n/g,' ')}\n`).join('\n');
  download(`transkript_${stamp()}.srt`, srt, 'application/x-subrip');
};
$('#btnAudio').onclick = () => {
  if(!audioURL) return toast('Kein Mitschnitt vorhanden.');
  const a = document.createElement('a'); a.href = audioURL; a.download = `aufnahme_${stamp()}.webm`; a.click();
};
let speaking = false;
$('#btnSpeak').onclick = () => {
  if(speaking){ speechSynthesis.cancel(); speaking = false; $('#btnSpeak').classList.remove('on'); return; }
  const t = plainText(); if(!t) return toast('Noch kein Text.');
  const u = new SpeechSynthesisUtterance(t);
  u.lang = segments[0]?.lang || 'de-DE'; u.rate = 1;
  u.onend = () => { speaking = false; $('#btnSpeak').classList.remove('on'); };
  speaking = true; $('#btnSpeak').classList.add('on'); speechSynthesis.speak(u);
};
$('#btnClear').onclick = () => {
  if(!segments.length) return;
  if(!confirm('Transkript wirklich löschen? (Ungesicherte Sitzung geht verloren)')) return;
  segments = []; elapsedBase = 0; startTime = Date.now(); renderAll(); persist();
};

/* ─────────── Sitzungen ─────────── */
const getSess = () => JSON.parse(localStorage.getItem('vox.sessions')||'[]');
const setSess = a => localStorage.setItem('vox.sessions', JSON.stringify(a));
$('#btnSave').onclick = () => {
  if(!segments.length) return toast('Noch kein Text.');
  const first = segments[0].text.slice(0,40);
  const name = prompt('Name der Sitzung:', first || 'Transkript') ;
  if(name === null) return;
  const a = getSess();
  a.unshift({id:Date.now(), name: name || 'Transkript', date: Date.now(),
             dur: elapsed(), mode, segments});
  setSess(a.slice(0,60)); toast('Sitzung gespeichert ✓');
};
function renderSessions(){
  const a = getSess();
  $('#sessList').innerHTML = a.length ? a.map(s => `
    <div class="sess" data-id="${s.id}">
      <div style="flex:1;min-width:0">
        <div class="nm">${esc(s.name)}</div>
        <div class="mt">${new Date(s.date).toLocaleString('de-DE')} · ${fmt(s.dur/1000)} · ${words(s.segments.map(x=>x.text).join(' '))} Wörter</div>
      </div>
      <button class="btn sm" data-act="load">Laden</button>
      <button class="btn sm danger" data-act="del">🗑️</button>
    </div>`).join('') : '<div class="empty">Noch keine gespeicherten Sitzungen.</div>';
}
$('#sessList').onclick = e => {
  const b = e.target.closest('button'); if(!b) return;
  const id = +b.closest('.sess').dataset.id;
  const a = getSess(), s = a.find(x => x.id === id);
  if(b.dataset.act === 'del'){ setSess(a.filter(x => x.id !== id)); renderSessions(); return; }
  if(listening) stop();
  segments = s.segments; segId = Math.max(0,...segments.map(x=>x.id)) + 1;
  elapsedBase = s.dur; mode = s.mode; setMode(mode); renderAll(); closePanels();
  toast('Sitzung geladen ✓');
};

/* ─────────── Persistenz ─────────── */
function persist(){
  if(!opt.autosave) return;
  localStorage.setItem('vox.current', JSON.stringify({segments, dur: elapsed(), mode}));
}
function restore(){
  try{
    const c = JSON.parse(localStorage.getItem('vox.current')||'null');
    if(c && c.segments?.length){
      segments = c.segments; elapsedBase = c.dur||0;
      segId = Math.max(0,...segments.map(x=>x.id)) + 1;
    }
  }catch(_){}
}

/* ─────────── Suche ─────────── */
$('#btnSearch').onclick = () => { $('#searchbar').classList.toggle('open'); $('#q').focus(); };
$('#btnSearchClose').onclick = () => { $('#q').value=''; $('#searchbar').classList.remove('open'); renderAll(); };
$('#q').oninput = () => renderAll();

/* ─────────── Panels ─────────── */
function openPanel(sel){ closePanels(); $(sel).classList.add('open'); $('#backdrop').classList.add('open'); }
function closePanels(){ document.querySelectorAll('.panel').forEach(p=>p.classList.remove('open'));
                        $('#backdrop').classList.remove('open'); }
$('#backdrop').onclick = closePanels;
document.querySelectorAll('[data-close]').forEach(b => b.onclick = closePanels);
$('#btnSettings').onclick = () => openPanel('#pSettings');
$('#btnSessions').onclick = () => { renderSessions(); openPanel('#pSessions'); };
$('#btnStats').onclick = showStats;

/* ─────────── Modus & Optionen ─────────── */
function setMode(m){
  mode = m; localStorage.setItem('vox.mode', m);
  document.querySelectorAll('.lang').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
  $('#modeHint').textContent = m === 'mix'
    ? 'Zwei Erkenner laufen parallel – pro Satz gewinnt die sicherere Sprache.'
    : (m === 'de' ? 'Reines Deutsch – höchste Genauigkeit.' : 'Pure English – highest accuracy.');
  if(listening){ stop(); setTimeout(start, 300); }
  renderAll();
}
document.querySelectorAll('.lang').forEach(b => b.onclick = () => setMode(b.dataset.mode));

function applyOpts(){
  document.querySelectorAll('[data-opt]').forEach(sw => sw.classList.toggle('on', !!opt[sw.dataset.opt]));
  document.body.dataset.theme = opt.theme;
  $('#btnTheme').textContent = opt.theme === 'dark' ? '🌙' : '☀️';
  transcript.classList.toggle('big', opt.bigText);
  $('#biasVal').textContent = opt.bias >= 55 ? 'eher '+opt.langA.slice(0,2).toUpperCase()
                            : opt.bias <= 45 ? 'eher '+opt.langB.slice(0,2).toUpperCase() : 'neutral';
}
document.querySelectorAll('[data-opt]').forEach(sw => sw.onclick = () => {
  const k = sw.dataset.opt; opt[k] = !opt[k]; saveOpt(); applyOpts(); renderAll();
  if((k==='recordAudio'||k==='continuous') && listening){ stop(); setTimeout(start,300); }
});
$('#btnTheme').onclick = () => { opt.theme = opt.theme==='dark'?'light':'dark'; saveOpt(); applyOpts(); };
[['#langA','langA'],['#langB','langB']].forEach(([sel,key]) => {
  const el = $(sel);
  el.innerHTML = LANGS.map(([v,n]) => `<option value="${v}">${n}</option>`).join('');
  el.value = opt[key];
  el.onchange = () => { opt[key] = el.value; saveOpt(); applyOpts(); if(listening){ stop(); setTimeout(start,300); } };
});
$('#bias').value = opt.bias;
$('#bias').oninput = () => { opt.bias = +$('#bias').value; saveOpt(); applyOpts(); };
$('#dict').value = localStorage.getItem('vox.dict')||'';
$('#btnDictSave').onclick = () => { localStorage.setItem('vox.dict', $('#dict').value); toast('Wörterbuch gespeichert ✓'); };

/* ─────────── Tastenkürzel ─────────── */
addEventListener('keydown', e => {
  if(e.target.isContentEditable || /INPUT|TEXTAREA/.test(e.target.tagName)){
    if(e.key === 'Escape') e.target.blur();
    return;
  }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase() === 'm'){ e.preventDefault(); listening ? stop() : start(); }
  else if((e.ctrlKey||e.metaKey) && e.key.toLowerCase() === 'f'){ e.preventDefault(); $('#btnSearch').click(); }
  else if(e.key === 'Escape'){ closePanels(); if(listening) stop(); }
});

/* ─────────── Start ─────────── */
restore(); applyOpts(); setMode(mode); renderAll();
if(!SR) toast('Spracherkennung wird hier nicht unterstützt – bitte Chrome, Edge oder Safari nutzen.', true);
addEventListener('beforeunload', e => { if(listening){ e.preventDefault(); e.returnValue = ''; } });
</script>
</body>
